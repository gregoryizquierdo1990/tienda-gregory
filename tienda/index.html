async function openResellerClientDossier(profId) {
  if (!profId) return;
  let rc = (S.resellerClientsList || []).find(x => x.profile_id === profId);
  if (!rc) {
    try {
      const { data } = await sb.rpc('my_reseller_clients');
      if (data) {
        S.resellerClientsList = data;
        rc = data.find(x => x.profile_id === profId);
      }
    } catch(e) {
      console.warn('Error fetching reseller client for dossier:', e);
    }
  }
  if (!rc) return toast('⚠️ No se encontró la información del perfil seleccionado.');

  const todayStr = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const today = new Date();
  today.setHours(0,0,0,0);
  let diffDays = null;
  if (rc.vence) {
    const [vy, vm, vd] = rc.vence.split('-').map(Number);
    const target = new Date(vy, vm - 1, vd);
    target.setHours(0,0,0,0);
    diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
  }

  const isHoy = rc.vence === todayStr;
  const isExp = diffDays !== null && diffDays < 0;
  const isProx = diffDays !== null && diffDays > 0 && diffDays <= 3;
  const isNoRen = rc.no_renueva === true;
  const isPend = rc.tiene_pendiente === true;

  const resellerName = S.me?.nombre || S.user?.user_metadata?.full_name || 'Revendedor Autorizado';
  const cleanPhone = cleanWaPhone(rc.cliente_telefono);
  const cleanMsg = isHoy
    ? formatMessageTemplate('aviso_vencimiento_hoy', {
        cliente: rc.cliente_nombre || 'Cliente',
        producto: rc.servicio || rc.plataforma || 'Servicio Digital',
        vence: rc.vence || 'Hoy',
        monto_usd: '—',
        monto_bs: '—',
        vendedor: resellerName
      })
    : formatMessageTemplate('datos_limpios_revendedor', {
        servicio: rc.servicio || rc.plataforma || 'Servicio Digital',
        correo: rc.correo,
        clave: rc.clave,
        perfil: rc.nombre_perfil || 'Perfil 1',
        pin: rc.pin || 'Sin PIN',
        vence: rc.vence || '30 días',
        vendedor: resellerName
      });

  const waClientUrl = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(cleanMsg)}` : '';

  const gregoryTel = (S.settings?.negocio?.telefono || '584142302384').replace(/\D/g, '');
  const gregoryWaTarget = gregoryTel.startsWith('58') ? gregoryTel : ('58' + gregoryTel.replace(/^0+/, ''));
  const pendWaMsg = `Hola Gregory! 👋 Te escribe *${S.me?.nombre || 'Revendedor'}* (${S.me?.codigo_identificacion || 'RVD'}).\n\nReporté el Pago Móvil de renovación para:\n👤 *Cliente:* ${rc.cliente_nombre || 'Cliente'}\n📺 *Servicio:* ${rc.servicio || rc.plataforma}\n🔖 *Referencia:* ${rc.orden_pendiente_ref || 'Pago Móvil'}\n\nPor favor concíliamelo cuando puedas. ¡Quedo atento!`;
  const waGregoryUrl = `https://wa.me/${gregoryWaTarget}?text=${encodeURIComponent(pendWaMsg)}`;

  let statusCardHtml = '';
  if (isPend) {
    statusCardHtml = `
      <div style="background:rgba(234,179,8,.12);border:1.5px solid rgba(234,179,8,.45);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:1.8rem">⏳</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <b style="color:#facc15;font-size:.92rem">PAGO EN VERIFICACIÓN</b>
            <span class="pill" style="font-size:.68rem;background:rgba(234,179,8,.2);color:#facc15;border-color:rgba(234,179,8,.5)">Ref #${esc(rc.orden_pendiente_ref || 'Pago Móvil')}</span>
          </div>
          <div class="mut" style="font-size:.76rem;margin-top:2px">
            Reportaste el pago de renovación. Gregory lo validará para reactivar o extender el período.
          </div>
        </div>
        <a class="g" href="${waGregoryUrl}" target="_blank" rel="noopener noreferrer" style="padding:6px 10px;font-size:.76rem;color:#facc15;border:1px solid rgba(234,179,8,.4);border-radius:8px;font-weight:700;text-decoration:none;white-space:nowrap">
          📲 Avisar WA
        </a>
      </div>
    `;
  } else if (isNoRen) {
    statusCardHtml = `
      <div style="background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.4);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:1.8rem">🔴</div>
        <div>
          <b style="color:#f87171;font-size:.92rem">CLIENTE NO RENUEVA</b>
          <div class="mut" style="font-size:.76rem;margin-top:2px">
            Reportado a administración para liberar el perfil y reasignarlo a la venta pública.
          </div>
        </div>
      </div>
    `;
  } else if (isHoy) {
    statusCardHtml = `
      <div style="background:rgba(239,68,68,.15);border:1.5px solid rgba(239,68,68,.5);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:1.8rem">⏰</div>
        <div style="flex:1">
          <b style="color:#f87171;font-size:.92rem">¡VENCE HOY! (${esc(rc.vence)})</b>
          <div class="mut" style="font-size:.76rem;margin-top:2px">
            La suscripción finaliza hoy. Envía el cobro al cliente o renueva con anticipación para no interrumpir el servicio.
          </div>
        </div>
      </div>
    `;
  } else if (isExp) {
    statusCardHtml = `
      <div style="background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.35);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:1.8rem">⚠️</div>
        <div>
          <b style="color:#f87171;font-size:.92rem">VENCIDO HACE ${Math.abs(diffDays)} DÍAS (Corte: ${esc(rc.vence || '—')})</b>
          <div class="mut" style="font-size:.76rem;margin-top:2px">
            La suscripción está vencida. Puedes renovarla para que el cliente continúe con las mismas credenciales.
          </div>
        </div>
      </div>
    `;
  } else if (isProx) {
    statusCardHtml = `
      <div style="background:rgba(245,158,11,.12);border:1.5px solid rgba(245,158,11,.4);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:1.8rem">⏳</div>
        <div>
          <b style="color:#f59e0b;font-size:.92rem">VENCE EN ${diffDays} DÍA${diffDays > 1 ? 'S' : ''} (Corte: ${esc(rc.vence)})</b>
          <div class="mut" style="font-size:.76rem;margin-top:2px">
            Próximo a vencer. Recuerda coordinar el cobro con tu cliente antes del corte.
          </div>
        </div>
      </div>
    `;
  } else {
    statusCardHtml = `
      <div style="background:rgba(0,245,160,.08);border:1.5px solid rgba(0,245,160,.3);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:1.8rem">🟢</div>
        <div>
          <b style="color:#00f5a0;font-size:.92rem">SERVICIO ACTIVO (${diffDays !== null ? `${diffDays} días restantes` : 'Vigente'})</b>
          <div class="mut" style="font-size:.76rem;margin-top:2px">
            Fecha de corte programada: <b>${esc(rc.vence || 'Sin fecha')}</b>
          </div>
        </div>
      </div>
    `;
  }

  const clienteNombreDisplay = rc.cliente_nombre && rc.cliente_nombre !== 'Cliente Asignado' && rc.cliente_nombre !== 'Cliente Tienda'
    ? rc.cliente_nombre
    : 'Sin identificar (Asignar)';

  $('#dlgBody').innerHTML = `
    <!-- HEADER DE LA FICHA -->
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:48px;height:48px;border-radius:12px;background:rgba(0,245,160,.12);border:1px solid rgba(0,245,160,.3);display:flex;align-items:center;justify-content:center;font-size:1.6rem">
          📺
        </div>

      showing = !showing;
      if (showing) {
        passSpan.textContent = rc.clave;
        passSpan.style.letterSpacing = 'normal';
        passSpan.style.color = '#38bdf8';

        passSpan.style.color = '#f8fafc';
        btnTogglePass.innerHTML = '👁️ Ver';
      }
    };

    btnSaveClient.onclick = async () => {
      const nuevoNombre = $('#inDossierClienteNombre')?.value?.trim() || '';
      const nuevoTel = $('#inDossierClienteTel')?.value?.trim() || '';
      btnSaveClient.disabled = true;
      btnSaveClient.innerHTML = '⏳ Guardando...';

      try {
        let rpcRes = await sb.rpc('reseller_update_client_info', {
          p_profile_id: rc.profile_id,
          p_cliente_nombre: nuevoNombre,
          p_cliente_telefono: nuevoTel || null
        });
        if (rpcRes.error) {
          rpcRes = await sb.rpc('reseller_set_cliente_final', {
            p_profile_id: rc.profile_id,
            p_cliente_nombre: nuevoNombre,
            p_cliente_telefono: nuevoTel || null
          });
          if (rpcRes.error) throw rpcRes.error;
        }

        // Actualizar datos en memoria
        rc.cliente_nombre = nuevoNombre || 'Cliente Asignado';
        rc.cliente_telefono = nuevoTel || null;
        if (S.resellerClientsList) {
          const item = S.resellerClientsList.find(x => x.profile_id === rc.profile_id);
          if (item) {
            item.cliente_nombre = nuevoNombre || 'Cliente Asignado';
            item.cliente_telefono = nuevoTel || null;
          }
        }

        // Actualizar la fila en la tabla visualmente sin parpadear ni destruir app
        const tableRow = document.querySelector(`tr[data-rc-profile-id="${rc.profile_id}"]`);
        if (tableRow) {
          const nameEl = tableRow.querySelector('td:first-child b');
          if (nameEl) {
            nameEl.textContent = rc.cliente_nombre;
            nameEl.style.color = (rc.cliente_nombre && rc.cliente_nombre !== 'Cliente Asignado' && rc.cliente_nombre !== 'Cliente Tienda') ? '#00f5a0' : '#f8fafc';
          }
          const editBtn = tableRow.querySelector('button[data-reseller-edit-client]');
          if (editBtn) {
            editBtn.setAttribute('data-current-name', nuevoNombre);
            editBtn.setAttribute('data-current-tel', nuevoTel);
            editBtn.innerHTML = `✏️ ${nuevoNombre ? 'Editar' : 'Asignar'}`;
          }
          let telEl = tableRow.querySelector('td:first-child div[style*="color:#38bdf8"]');
          if (nuevoTel) {
            if (!telEl) {
              telEl = document.createElement('div');
              telEl.style = 'font-size:.76rem;color:#38bdf8;margin-top:2px';
              tableRow.querySelector('td:first-child')?.appendChild(telEl);
            }
            telEl.textContent = '📱 ' + nuevoTel;
          } else if (telEl) {
            telEl.remove();
          }
        }

        btnSaveClient.disabled = false;
        btnSaveClient.innerHTML = '✅ ¡Guardado con Éxito!';
        btnSaveClient.style.background = '#22c55e';
        btnSaveClient.style.color = '#fff';

        // Reabrir la ficha suavemente para refrescar botones y textos de WhatsApp
        setTimeout(() => {
          openResellerClientDossier(rc.profile_id);
        }, 600);
      } catch (err) {
        console.error('Error al guardar cliente en ficha:', err);
        btnSaveClient.disabled = false;
        btnSaveClient.innerHTML = '💾 Guardar Datos del Cliente';
        btnSaveClient.style.background = '#00f5a0';
        btnSaveClient.style.color = '#0b0f19';
        alert('⚠️ Error al guardar: ' + (err.message || err));
      }
    };
  }

  const btnRenovar = $('#btnDossierRenovar');
  if (btnRenovar) {
    btnRenovar.onclick = () => {
      dlg.close();
      openRenewalModal({
        profileId: rc.profile_id,
        nom: rc.cliente_nombre,
        srv: rc.servicio || rc.plataforma,
        prof: rc.nombre_perfil,
        pin: rc.pin,
        mail: rc.correo,
        tel: rc.cliente_telefono,
        curVence: rc.vence
      });
    };
  }

  const btnNoRen = $('#btnDossierNoRenueva');
  if (btnNoRen) {
    btnNoRen.onclick = () => {
      const bRow = document.querySelector(`[data-reseller-no-renueva="${rc.profile_id}"]`);
      if (bRow) {
        bRow.click();
      } else {
        dlg.close();
      }
    };
  }
}

async function openAdminAssignProfileResellerModal(opts = {}) {
  const { profileId, curResellerId = '', curResellerName = '', curClient = '', curTel = '', srv = 'Servicio', prof = 'Perfil' } = opts;
  if (!profileId) return;

  let resellers = S.cachedResellersList || [];
  if (!resellers.length) {
    try {
      const { data, error } = await sb.from('customers')
        .select('id, nombre, email, telefono, codigo_identificacion')
        .or('es_revendedor.eq.true,codigo_identificacion.like.RVD%')
        .order('nombre');
      if (!error && data) {
        resellers = data;
        S.cachedResellersList = data;
      }
    } catch(e) {
      console.warn('Error fetching resellers:', e);
    }
  }

  const options = resellers.map(r => {
    const isSel = (curResellerId && r.id === curResellerId) || (!curResellerId && curResellerName && (r.nombre === curResellerName || r.email === curResellerName)) ? 'selected' : '';
    return `<option value="${r.id}" ${isSel}>${esc(r.nombre || r.email)} (${esc(r.codigo_identificacion || 'RVD')}) ${r.telefono ? '· ' + esc(r.telefono) : ''}</option>`;
  }).join('');

  $('#dlgBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div style="font-size:2rem;background:rgba(56,189,248,.12);border-radius:12px;width:48px;height:48px;display:flex;align-items:center;justify-content:center">🤝</div>
      <div>
        <h3 style="margin:0;color:#38bdf8">Asignar Perfil a Revendedor</h3>
        <div class="mut" style="font-size:.82rem;margin-top:2px">
          <b>${esc(srv)}</b> · ${esc(prof)}
        </div>
      </div>
    </div>

    <p class="mut" style="font-size:.84rem;margin:0 0 14px;line-height:1.45">
      Transfiere este perfil y cliente a uno de tus revendedores oficiales. Aparecerá en su sección <b>"Mis Clientes & Perfiles Asignados"</b> para que él atienda sus accesos, recordatorios y cobros de renovación.
    </p>

    <div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin-bottom:14px">
      <div style="margin-bottom:12px">
        <label style="font-size:.78rem;font-weight:700;color:#cbd5e1;display:block;margin-bottom:5px">Revendedor Asignado:</label>
        <select id="selProfileReseller" style="width:100%;padding:10px 12px;font-size:.88rem;border-radius:8px">
          <option value="">🏪 Tienda Central (Gregory / Venta Directa)</option>
          ${options}
        </select>
        <div class="mut" style="font-size:.72rem;margin-top:4px">Si seleccionas "Tienda Central", volverá a estar bajo tu atención directa.</div>
      </div>

      <div style="margin-bottom:12px">
        <label style="font-size:.78rem;font-weight:700;color:#cbd5e1;display:block;margin-bottom:5px">Nombre del Cliente Final (Uso Interno):</label>
        <input id="inProfileClienteFinal" value="${esc(curClient && curClient !== 'Cliente Asignado' && curClient !== 'Cliente Tienda' ? curClient : '')}" placeholder="Ej: Carlos Mendoza / Dra. Gómez" style="width:100%;padding:9px 12px;font-size:.88rem;border-radius:8px">
      </div>

      <div>
        <label style="font-size:.78rem;font-weight:700;color:#cbd5e1;display:block;margin-bottom:5px">WhatsApp del Cliente (Opcional):</label>
        <input id="inProfileClienteTel" value="${esc(curTel)}" placeholder="Ej: 04141234567 o +58414..." style="width:100%;padding:9px 12px;font-size:.88rem;border-radius:8px">
        <div class="mut" style="font-size:.72rem;margin-top:4px">El revendedor podrá contactarlo o mandarle las credenciales en 1 clic.</div>
      </div>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="g" onclick="dlg.close()">Cancelar</button>
      <button id="btnConfirmProfileReseller" style="background:#00f5a0;color:#0b0f19;font-weight:800;border:none;border-radius:8px;padding:9px 18px;cursor:pointer">
        💾 Confirmar Asignación
      </button>
    </div>
  `;

  dlg.showModal();

  $('#btnConfirmProfileReseller').onclick = async () => {
    const btn = $('#btnConfirmProfileReseller');
    btn.disabled = true;
    btn.textContent = '⏳ Asignando...';

    const selId = $('#selProfileReseller')?.value || null;
    const clFinal = $('#inProfileClienteFinal')?.value?.trim() || null;
    const clTel = $('#inProfileClienteTel')?.value?.trim() || null;

    try {
      const { data, error } = await sb.rpc('admin_assign_profile_reseller', {
        p_profile_id: profileId,
        p_reseller_id: selId,
        p_cliente_final: clFinal,
        p_cliente_telefono: clTel,
        p_marcar_vendido: true
      });
      if (error) throw error;

      toast(data?.message || '✅ Perfil asignado correctamente.');
      dlg.close();
      invalidateAdminCache('profiles_inventory');
      if (S.view === 'admin') admin('profiles_inventory');
    } catch(err) {
      btn.disabled = false;
      btn.textContent = '💾 Confirmar Asignación';
      toast('⚠️ Error al asignar revendedor: ' + (err.message || err));
    }
  };

function detectSubdomain(){
  const urlParam = new URLSearchParams(window.location.search).get('franchise') || new URLSearchParams(window.location.search).get('sub');
  if(urlParam) return urlParam.toLowerCase().trim();
  const host = window.location.hostname.toLowerCase();
  const parts = host.split('.');
  // Ignora localhost, 127.0.0.1, y hosts sin subdominio o www
  if(parts.length <= 2 || host === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(host)) return null;
  const sub = parts[0];
  if(['www', 'tienda', 'app', 'panel', 'admin'].includes(sub)) return null;
  return sub;
}

async function onSession(session){
  if(session?.provider_token) sessionStorage.setItem('gtk',session.provider_token);
  const prevUser = S.user;
  const isSameUser = prevUser && session?.user && prevUser.id === session.user.id;
  S.user = session?.user||null;
  if(!S.user){
    S.me = null; S.isAdmin = false;
  } else {
    if(!isSameUser) S.isAdmin = false;
    const email = (S.user.email||'').toLowerCase();
    const isGoogle = S.user.app_metadata?.provider === 'google' 
      || (S.user.identities||[]).some(x=>x.provider==='google')
      || (S.user.app_metadata?.providers||[]).includes('google');
    const isKnown = email === 'emprendimientogregoryizquierdo@gmail.com' 
      || email === 'gregoryizquierdo1990@gmail.com'
      || (S.settings.negocio?.correo && email === String(S.settings.negocio.correo).toLowerCase());
    try {
      const [m, a, rpc] = await Promise.all([
        sb.from('customers').select('*').eq('id',S.user.id).maybeSingle(),
        Promise.resolve(sb.from('admins').select('email').ilike('email', email).maybeSingle()).catch(()=>({data:null})),
        Promise.resolve(sb.rpc('is_admin')).catch(()=>({data:null}))
      ]);
      S.me = m?.data || S.me;
      S.isAdmin = Boolean(rpc?.data === true || a?.data || isKnown);
      if(S.isAdmin && facetDlg && facetDlg.open) facetDlg.close();
      sb.from('login_log').insert({customer_id:S.user.id,email:S.user.email,user_agent:navigator.userAgent}).then(()=>{});
      if(S.me?.debe_cambiar_password === true && !S.isAdmin){
        setTimeout(() => forceChangePasswordDlg(), 250);
      }
    } catch(err) {
      if(isKnown) S.isAdmin = true;
      if(S.isAdmin && facetDlg && facetDlg.open) facetDlg.close();
    }
  }
  $('#bLogin').classList.toggle('hide',!!S.user);
  $('#bRegister').classList.toggle('hide',!!S.user);
  $('#bOut').classList.toggle('hide',!S.user);
  $('#bPortal').classList.toggle('hide',!S.user);
  if(S.isAdmin) {
    $('#bPortal').textContent = '⚙️ Panel Admin';
    $('#bPortal').title = 'Panel de Administración Central';
  } else if(S.me?.es_revendedor) {
    $('#bPortal').textContent = S.me?.es_demo ? '💼 Portal Revendedor (Demo)' : '💼 Mi Portal Revendedor';
    $('#bPortal').title = 'Portal de Revendedor Oficial';
  } else {
    $('#bPortal').textContent = S.me?.es_demo ? '👤 Mi Portal (Demo)' : 'Mi portal';
    $('#bPortal').title = 'Mi portal de cliente';
  }
  // Boton de Notificaciones visible para todos los usuarios autenticados
  $('#bSnd').classList.toggle('hide', !S.user); updSnd(); badge(); checkVenc();
}

function renderGrid(){
  const q=(S.q||'').toLowerCase();
  const list=S.products.filter(p=>{
    if(S.franchise && (p.es_exclusivo_central || p.tipo === 'gaming' || p.tipo === 'recarga_telefonica')) return false;
    const isCombo = (p.nombre || '').toLowerCase().includes('combo');
    let matchesType = true;
    if(S.tipo === 'combos'){
      matchesType = isCombo;
    } else if(S.tipo === 'servicio'){
      matchesType = p.tipo === 'servicio' && !isCombo;
    } else if(S.tipo){
      matchesType = p.tipo === S.tipo && !isCombo;
    }
    return matchesType && (p.nombre||'').toLowerCase().includes(q);
  });
  const g=$('#grid'); if(!g) return;
  g.innerHTML=list.map(productCard).join('')||'<p class="mut empty">Aún no hay productos disponibles en esta categoría. Vuelve pronto.</p>';
  g.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyDlg(b.dataset.buy));
  g.querySelectorAll('[data-flyer]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openFlyerDesignerModal({productId:b.dataset.flyer});});
}
function renderTabs(){

async function buyDlg(id){
  if(!S.user) return loginDlg('login');
  if(S.me?.debe_cambiar_password === true && !S.isAdmin) return forceChangePasswordDlg();
  const p = S.products.find(x => x.id === id);
  if(!p) return toast('Producto no encontrado');

  const pmQuery = S.franchise
    ? sb.from('payment_methods').select('*').eq('activo', true).or(`franchise_id.eq.${S.franchise.id},franchise_id.is.null`).order('orden')
    : sb.from('payment_methods').select('*').eq('activo', true).is('franchise_id', null).order('orden');

  const [{data: rawPmList}, {data: h}, {data: userCard}] = await Promise.all([
    pmQuery,
    sb.from('zeny_ledger').select('monto').eq('tipo', 'compra').eq('estado', 'pendiente'),
    (async () => {
      try {
        const r1 = await sb.from('my_zeny_cards').select('*').eq('customer_id', S.user.id).maybeSingle();
        if (r1?.data) return r1;
        return await sb.from('zeny_cards').select('*').eq('customer_id', S.user.id).maybeSingle();
      } catch(e) { return { data: null }; }
    })()
  ]);
  const pmList = (rawPmList && rawPmList.length > 0) ? rawPmList : DEFAULT_PAYMENT_METHODS;

  const hasActiveCard = userCard && userCard.estado === 'activa';
  const availZeny = Math.max(0, Number(S.me?.zeny_balance || 0) + (h || []).reduce((a, x) => a + Number(x.monto), 0));
  const maxZeny = Math.min(availZeny, Number(p.precio_usd));
  let currentStep = 'method'; // 'method' (Paso 1) o 'details' (Paso 2)
  let payPlan = 'contado'; // 'contado' o 'cuotas'
  let selectedMethodId = (pmList && pmList.length > 0) ? pmList[0].id : null;
  let appliedZeny = 0;
  let paySplit = 'unico'; // 'unico' o 'mixto'
  let splitM1Id = (pmList && pmList.length > 0) ? pmList[0].id : null;
  let splitM2Id = (pmList && pmList.length > 1) ? pmList[1].id : splitM1Id;
  let splitM1Amount = 0;
  let splitRef1 = '';
  let splitRef2 = '';

  // Variables y sincronización de datos de recarga (Gaming, Telefonía, Combos y Servicios Bajo Pedido)
  let rechargeData = { player_id: '', servidor: '', nickname: '', operadora: 'Movistar', telefono: '', correo_activacion: '', texto_activacion: '', datos_activacion: '' };
  const isGaming = p.tipo === 'gaming';
  const isTelecom = p.tipo === 'recarga_telefonica';
  const isCombo = (p.nombre || '').toLowerCase().includes('combo');
  const isServicio = p.tipo === 'servicio' && !isCombo;
  const isRechargeService = isGaming || isTelecom;

  const syncRecharge = () => {
    const elPlayer = $('#recPlayerId');
    const elServer = $('#recServer');
    const elNick = $('#recNickname');
    const elOp = $('#recOperator');
    const elPhone = $('#recPhone');
    const elServTexto = $('#recServicioTexto') || $('#recServicioEmail');
    if(elPlayer) rechargeData.player_id = elPlayer.value.trim();
    if(elServer) rechargeData.servidor = elServer.value.trim();
    if(elNick) rechargeData.nickname = elNick.value.trim();
    if(elOp) rechargeData.operadora = elOp.value;
    if(elPhone) rechargeData.telefono = elPhone.value.trim();
    if(elServTexto){
      const val = elServTexto.value.trim();
      rechargeData.texto_activacion = val;
      rechargeData.datos_activacion = val;
      rechargeData.correo_activacion = val;
    }
  };

  const getOrderDatosRecarga = () => {
    syncRecharge();
    if(isRechargeService) return rechargeData;
    if(isServicio || isCombo){
      const val = (rechargeData.texto_activacion || rechargeData.datos_activacion || rechargeData.correo_activacion || '').trim();
      return val ? { texto_activacion: val, datos_activacion: val, correo_activacion: val } : {};
    }
    return {};
  };

  const validateRecharge = () => {
    syncRecharge();
    if(isGaming && !rechargeData.player_id){
      toast('⚠️ Por favor indica tu ID de jugador o usuario para procesar la recarga.');
      return false;
    }
    if(isTelecom && !rechargeData.telefono){
      toast('⚠️ Por favor indica el número de teléfono o cuenta contrato a recargar.');
      return false;
    }
    return true;
  };

  // Calculos de precio (Minorista o Mayorista si es Revendedor)
  const isReseller = S.me?.es_revendedor === true;
  const isCentralOnly = p.es_exclusivo_central === true || isGaming || isTelecom;
  const standardPrice = Number(p.precio_usd);
  let totalOriginal = standardPrice;
  if(!isCentralOnly && isReseller){
    if(p.precio_revendedor_usd != null && Number(p.precio_revendedor_usd) > 0){
      totalOriginal = Number(p.precio_revendedor_usd);
    } else {
      const niveles = typeof getNivelesConfig === 'function' ? getNivelesConfig() : {};
      const descRev = Number(niveles?.revendedor?.descuento || 15);
      totalOriginal = Math.round((standardPrice * (1 - descRev / 100)) * 100) / 100;
    }
  }

  // Parametros configurables de cuotas (definidos manualmente por el admin en ajustes)
  const cuotasCfg = S.settings?.cuotas_config || { inicial_porcentaje: 50, total_cuotas: 2, dias_frecuencia: 15, monto_minimo: 5.00 };
  const isBnplEligible = (p.permite_cuotas === true) && (totalOriginal >= Number(cuotasCfg.monto_minimo || 5));
  const nCuotas = Math.max(2, Number(cuotasCfg.total_cuotas || 2));
  const pctInicial = Math.min(90, Math.max(10, Number(cuotasCfg.inicial_porcentaje || 50)));
  const cuotaInicialUsd = Math.round((totalOriginal * (pctInicial / 100)) * 100) / 100;
  const restanteUsd = Math.round((totalOriginal - cuotaInicialUsd) * 100) / 100;
  const cuotaRestanteUsd = Math.round((restanteUsd / (nCuotas - 1)) * 100) / 100;
  const diasFrecuencia = Number(cuotasCfg.dias_frecuencia || 15);

  const dateNow = new Date();
  const d1Str = dateNow.toISOString().slice(0, 10);

  const buildInstallmentsData = (ordId, refVal) => {

    }];
    for(let c = 2; c <= nCuotas; c++){
      const due = new Date(dateNow.getTime() + (c - 1) * diasFrecuencia * 86400000).toISOString().slice(0, 10);
      const mCuota = c === nCuotas ? (restanteUsd - cuotaRestanteUsd * (nCuotas - 2)) : cuotaRestanteUsd;
      list.push({
        order_id: ordId, customer_id: S.user.id, numero_cuota: c, total_cuotas: nCuotas,
        monto_usd: Math.round(mCuota * 100) / 100, fecha_vencimiento: due, estado: 'pendiente'
      });
    }
    return list;
  };

  // Parsea datos estructurados: si viene como objeto los usa; si el administrador guardó todo en un solo texto o nombre lo divide en cajones limpios
  const parseMethodFields = (method) => {
    if(!method) return [];
    let rawData = method.datos || {};
    if(typeof rawData === 'string'){
      try { rawData = JSON.parse(rawData); } catch(e){}
    }
    let fields = [];

    if(typeof rawData === 'object' && rawData !== null && Object.keys(rawData).length > 0){
      for(const [k, v] of Object.entries(rawData)){
        if(v != null && String(v).trim()) fields.push({ label: k, value: String(v).trim() });

    }

    if(fields.length <= 1){
      const combinedText = [fields[0]?.value || '', method.nombre || '', method.tipo || ''].join(' ');

      const bankMatch = combinedText.match(/(?:banco|bnc|banesco|mercantil|venezuela|provincial|bod|bancaribe|exterior|activo)\s*(?:\d{4})?/i);
      if(bankMatch) parsed.push({ label: 'Banco', value: bankMatch[0].trim() });
      else if(method.nombre && !/04\d{2}/.test(method.nombre)) parsed.push({ label: 'Método', value: method.nombre });

      const phoneMatch = combinedText.match(/(?:04\d{2}[\s.-]?\d{7}|4\d{2}[\s.-]?\d{7}|\+58[\s.-]?\d{10})/);
      if(phoneMatch) parsed.push({ label: 'Celular / Teléfono', value: phoneMatch[0].replace(/[\s.-]/g, '') });

      const docMatch = combinedText.match(/([VvJjEeGg][\s.-]?\d{6,9}|\b\d{7,8}\b)/);
      if(docMatch) parsed.push({ label: 'RIF / Cédula', value: docMatch[0].toUpperCase().replace(/[\s.-]/g, '') });

      if(parsed.length >= 2){

    if(fields.length === 0){

    return fields;

  const renderCheckout = () => {
    const selectedMethod = (pmList || []).find(m => m.id === selectedMethodId) || (pmList || [])[0];

    const m1 = (pmList || []).find(m => m.id === splitM1Id) || (pmList || [])[0];

        const textToCopy = btn.dataset.copy;
        try {
          if(navigator.clipboard && navigator.clipboard.writeText){
            await navigator.clipboard.writeText(textToCopy);
          } else {
            const ta = document.createElement('textarea');
            ta.value = textToCopy;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          const origHtml = btn.innerHTML;
          btn.classList.add('copied');
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

            btn.classList.remove('copied');

      const refVal = $('#coRefInput')?.value?.trim() || '';
      if(!refVal){
        btn.disabled = false;
        return toast('Por favor ingresa la referencia de tu pago.');
      }

      const orderRef = payPlan === 'cuotas' ? `[Cuotas 1/2] ${refVal}` : refVal;

      const {data: ordId, error} = await sb.rpc('create_order', {
        p_product: id,
        p_metodo: selectedMethodId,
        p_ref: orderRef,
        p_zeny: appliedZeny,
        p_datos_recarga: getOrderDatosRecarga(),
        p_es_cuotas: payPlan === 'cuotas',
        p_franchise_id: S.franchise?.id || null
      });

      if(error){
        btn.disabled = false;
        return toast(error.message.includes('Agotado') ? 'Este servicio se agotó. Elige otro.' : error.message);
      }

      // Notificar de inmediato al bot de Telegram y push
      fetch('/api/notify-event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'compra_servicio',
          data: {
            producto: p?.nombre || 'Servicio Digital',
            cliente: S.user?.user_metadata?.nombre || S.me?.nombre || S.user?.email || 'Cliente',
            email: S.user?.email,
            telefono: S.me?.telefono || (isRechargeService ? rechargeData.telefono : ''),
            datos_activacion: isServicio ? (rechargeData.texto_activacion || rechargeData.datos_activacion || rechargeData.correo_activacion || '') : (isGaming ? `ID: ${rechargeData.player_id}` : (isTelecom ? `Tlf: ${rechargeData.telefono}` : '')),
            total_usd: restUsd,
            total_bs: restBs,
            metodo: displayMethodName,
            referencia: orderRef,
            order_id: ordId,
            es_cuotas: payPlan === 'cuotas'
          }
        })
      }).catch(()=>{});

      checkoutDlg.close();
      await loadPublic();
      toast(payPlan === 'cuotas' ? `Pago de inicial enviado. Tu cuota 2 ($${cuotaDosUsd.toFixed(2)}) quedó registrada para el ${d2Str}.` : `Pedido enviado con éxito. Reservamos tu servicio por ${S.settings.reserva?.minutos||60} minutos.`);
      portal();
    };
  };

  renderCheckout();
  if(!checkoutDlg.open) checkoutDlg.showModal();
}

        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));

// ---------- GENERADOR RÁPIDO DE FLYERS Y BANNERS (HTML5 CANVAS 1080x1080) ----------
function openFlyerDesignerModal(initialOpts = {}){
  const fDlg = $('#flyerDlg');
  if(!fDlg) return;

  const products = S.products || [];
  let selectedProduct = products.find(p => p.id === initialOpts.productId) || products[0] || {
    id: 'sample',
    nombre: 'Max Platino 30 Días',
    duracion_dias: 30,
    garantia_dias: 30,
    precio_usd: 3.50,
    imagen_url: ''
  };

  let theme = 'neon_cyber';
  let flyerPriceUsd = initialOpts.defaultPrice || selectedProduct.precio_usd || 3.50;
  let sellerName = initialOpts.sellerName || S.franchise?.nombre_comercial || S.settings?.negocio?.nombre || (S.me?.nombre ? `Aliado ${S.me.nombre}` : 'Emprendimiento Gregory Izquierdo');
  let sellerPhone = initialOpts.sellerPhone || S.franchise?.titular_telefono || S.settings?.negocio?.telefono || S.me?.telefono || '+58 412 0000000';

  const renderFlyer = () => {
    const canvas = $('#flyerCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = 1080, H = 1080;

    // 1. Fondo base según tema
    ctx.clearRect(0, 0, W, H);
    if(theme === 'neon_cyber'){
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#070f1e');
      bg.addColorStop(0.5, '#030814');
      bg.addColorStop(1, '#02040a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Círculos glow neón
      const g1 = ctx.createRadialGradient(200, 200, 20, 200, 200, 450);
      g1.addColorStop(0, 'rgba(0, 245, 160, 0.25)');
      g1.addColorStop(1, 'rgba(0, 245, 160, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);

      const g2 = ctx.createRadialGradient(900, 850, 40, 900, 850, 500);
      g2.addColorStop(0, 'rgba(168, 85, 247, 0.3)');
      g2.addColorStop(1, 'rgba(168, 85, 247, 0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, W, H);
    } else if(theme === 'gold_luxury'){
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#1c1505');
      bg.addColorStop(0.6, '#0b0802');
      bg.addColorStop(1, '#020202');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const g1 = ctx.createRadialGradient(540, 400, 50, 540, 400, 600);
      g1.addColorStop(0, 'rgba(245, 158, 11, 0.28)');
      g1.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);
    } else if(theme === 'purple_stream'){
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#2e1065');
      bg.addColorStop(0.6, '#0f0524');
      bg.addColorStop(1, '#05020c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const g1 = ctx.createRadialGradient(850, 250, 40, 850, 250, 550);
      g1.addColorStop(0, 'rgba(236, 72, 153, 0.28)');
      g1.addColorStop(1, 'rgba(236, 72, 153, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);
    } else {
      // emerald_tech
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#064e3b');
      bg.addColorStop(0.6, '#022c22');
      bg.addColorStop(1, '#021510');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const g1 = ctx.createRadialGradient(300, 750, 50, 300, 750, 550);
      g1.addColorStop(0, 'rgba(16, 185, 129, 0.3)');
      g1.addColorStop(1, 'rgba(16, 185, 129, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);
    }

    // 2. Marco exterior sutil
    ctx.strokeStyle = theme === 'gold_luxury' ? 'rgba(245,158,11,.4)' : 'rgba(0,245,160,.35)';
    ctx.lineWidth = 4;
    ctx.strokeRect(36, 36, W - 72, H - 72);

    // 3. Encabezado de Marca
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 38px Sora, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(sellerName.toUpperCase(), 70, 105);

    // Badge VIP Top Right
    ctx.fillStyle = theme === 'gold_luxury' ? '#f59e0b' : '#00f5a0';
    ctx.font = '800 24px Sora, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('⭐ SERVICIO VERIFICADO 24/7', W - 70, 105);

    // Línea separadora
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(70, 130);
    ctx.lineTo(W - 70, 130);
    ctx.stroke();

    // 4. Badge Categoría / Modalidad
    const isService = selectedProduct.tipo === 'servicio';
    const isCombo = (selectedProduct.nombre || '').toLowerCase().includes('combo');
    const badgeText = isCombo ? '🔥 COMBO PROMOCIONAL' : (isService ? '📦 MEMBRESÍA BAJO PEDIDO' : '⚡ PANTALLA EN CUENTA PREMIUM');

    ctx.fillStyle = isCombo ? '#f43f5e' : (isService ? '#c084fc' : '#38bdf8');
    ctx.font = '800 24px Sora, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(badgeText, 70, 180);

    // 5. Título del Producto (con salto de línea si es largo)
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 60px Sora, sans-serif';
    const titleWords = (selectedProduct.nombre || 'Servicio Digital').split(' ');
    let line1 = '', line2 = '';
    for(let word of titleWords){
      if((line1 + ' ' + word).trim().length <= 22 && !line2){
        line1 = (line1 + ' ' + word).trim();
      } else {
        line2 = (line2 + ' ' + word).trim();
      }
    }
    ctx.fillText(line1, 70, 255);
    if(line2) ctx.fillText(line2, 70, 325);

    // 6. Badges de Especificaciones (Garantía, Duración, Entrega)
    const durDias = selectedProduct.duracion_dias || 30;
    const garDias = selectedProduct.garantia_dias || 30;
    const chipsY = line2 ? 385 : 320;

    const drawPill = (x, y, text, color) => {
      ctx.font = '700 24px Sora, sans-serif';
      const tw = ctx.measureText(text).width;
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y - 28, tw + 28, 42, 21);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, x + 14, y);
      return tw + 44;
    };

    let curX = 70;
    curX += drawPill(curX, chipsY, `⏱️ ${durDias} Días`, '#38bdf8');
    curX += drawPill(curX, chipsY, `🛡️ Garantía ${garDias} Días`, '#10b981');
    drawPill(curX, chipsY, `⚡ Activación Rápida`, '#facc15');

    // 7. Imagen del Producto (si existe) o icono central estilizado
    const imgY = chipsY + 45;
    const imgBoxH = 340;
    if(selectedProduct.imagen_url && selectedProduct.imagen_url.startsWith('http')){
      const pImg = new Image();
      pImg.crossOrigin = 'anonymous';
      pImg.onload = () => {
        // Recalcular y dibujar imagen
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.75)';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.roundRect(70, imgY, W - 140, imgBoxH, 20);
        ctx.clip();
        ctx.drawImage(pImg, 70, imgY, W - 140, imgBoxH);
        ctx.restore();
        // Redibujar caja de precios encima para garantizar superposición perfecta
        drawPriceAndFooter();
      };
      pImg.onerror = () => drawPriceAndFooter();
      pImg.src = selectedProduct.imagen_url;
    } else {
      drawPriceAndFooter();
    }

    function drawPriceAndFooter(){
      // 8. Tarjeta de Precio Gigante
      const boxY = 760;
      const boxH = 175;

      const pGrad = ctx.createLinearGradient(70, boxY, W - 70, boxY + boxH);
      pGrad.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
      pGrad.addColorStop(1, 'rgba(3, 7, 18, 0.98)');
      ctx.fillStyle = pGrad;
      ctx.strokeStyle = theme === 'gold_luxury' ? '#f59e0b' : '#00f5a0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(70, boxY, W - 140, boxH, 24);
      ctx.fill();
      ctx.stroke();

      // Monto en Dólares
      ctx.textAlign = 'left';
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 24px Sora, sans-serif';
      ctx.fillText('PRECIO DE OFERTA:', 105, boxY + 50);

      ctx.fillStyle = theme === 'gold_luxury' ? '#fbbf24' : '#00f5a0';
      ctx.font = '900 84px Sora, sans-serif';
      ctx.fillText(`$${Number(flyerPriceUsd).toFixed(2)}`, 105, boxY + 135);

      // Monto en Bolívares
      const curRate = S.rate || 0;
      const priceBs = (flyerPriceUsd * curRate).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 48px Sora, sans-serif';
      ctx.fillText(`Bs. ${priceBs}`, W - 105, boxY + 90);

      ctx.fillStyle = '#64748b';
      ctx.font = '700 22px Sora, sans-serif';
      ctx.fillText(`Tasa Oficial BCV: ${curRate ? curRate.toFixed(2) : '--'} Bs/USD`, W - 105, boxY + 130);

      // 9. Barra de Contacto y WhatsApp (Footer)
      const footY = 960;
      ctx.fillStyle = '#25d366';
      ctx.font = '900 36px Sora, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`📲 WhatsApp: ${sellerPhone}`, 70, footY + 45);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '700 26px Sora, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('¡Escríbenos y activa el tuyo hoy!', W - 70, footY + 45);
    }
  };

  fDlg.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:1.3rem">🎨</span>
        <div>
          <h3 style="margin:0;font-size:1.1rem;color:#fff">Diseñador Rápido de Flyers Publicitarios</h3>
          <span class="mut" style="font-size:.72rem">Exportación HD 1080x1080 para WhatsApp e Instagram</span>
        </div>
      </div>
      <button class="checkout-close-btn" onclick="flyerDlg.close()">✕</button>
    </div>

    <div class="flyer-layout">
      <!-- Columna Izquierda: Vista Previa Canvas -->
      <div class="flyer-preview-box">
        <div class="flyer-canvas-container">
          <canvas id="flyerCanvas" width="1080" height="1080"></canvas>
        </div>
        <div class="row" style="margin-top:14px;width:100%">
          <button id="btnDownloadFlyer" style="flex:1;background:var(--grad);color:#03121c;font-weight:800;padding:12px">
            📥 Descargar Flyer (PNG HD)
          </button>
          <button id="btnShareFlyerWa" class="g" style="padding:12px 14px;color:#25d366;border-color:rgba(37,211,102,.4);font-weight:700" title="Compartir texto e imagen en WhatsApp">
            📲 WhatsApp
          </button>
        </div>
      </div>

      <!-- Columna Derecha: Controles de Personalización -->
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label style="display:block;font-size:.76rem;font-weight:700;color:#94a3b8;margin-bottom:4px">1. Selecciona el Producto del Catálogo:</label>
          <select id="selFlyerProduct" style="width:100%">
            ${products.map(p => `<option value="${p.id}" ${p.id === selectedProduct.id ? 'selected' : ''}>${esc(p.nombre)} ($${Number(p.precio_usd||0).toFixed(2)})</option>`).join('')}
          </select>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="display:block;font-size:.76rem;font-weight:700;color:#94a3b8;margin-bottom:4px">2. Precio Venta ($ USD):</label>
            <input id="inpFlyerPrice" type="number" step="0.10" value="${flyerPriceUsd}" style="width:100%;font-weight:800;font-size:.95rem">
          </div>
          <div>
            <label style="display:block;font-size:.76rem;font-weight:700;color:#94a3b8;margin-bottom:4px">3. Estilo / Tema Neón:</label>
            <select id="selFlyerTheme" style="width:100%">
              <option value="neon_cyber" selected>🌌 Neón Cyberpunk</option>
              <option value="gold_luxury">👑 Oro VIP Zeny</option>
              <option value="purple_stream">🟣 Púrpura Streaming</option>
              <option value="emerald_tech">🟢 Verde Esmeralda</option>
            </select>
          </div>
        </div>

        <div>
          <label style="display:block;font-size:.76rem;font-weight:700;color:#94a3b8;margin-bottom:4px">4. Nombre Comercial / Marca en el Flyer:</label>
          <input id="inpFlyerSellerName" value="${esc(sellerName)}" style="width:100%">
        </div>

        <div>
          <label style="display:block;font-size:.76rem;font-weight:700;color:#94a3b8;margin-bottom:4px">5. Número de WhatsApp para Clientes:</label>
          <input id="inpFlyerSellerPhone" value="${esc(sellerPhone)}" style="width:100%">
        </div>

        <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;font-size:.78rem;line-height:1.4">
          💡 <b>Consejo de Ventas:</b> Descarga la imagen y súbela de inmediato a tus estados de WhatsApp con el texto: <i>"Disponible con entrega inmediata y garantía. Escríbeme al privado para activar el tuyo ⚡"</i>.
        </div>
      </div>
    </div>
  `;

  $('#selFlyerProduct').onchange = e => {
    selectedProduct = products.find(p => p.id === e.target.value) || selectedProduct;
    flyerPriceUsd = selectedProduct.precio_usd || 3.50;
    $('#inpFlyerPrice').value = flyerPriceUsd;
    renderFlyer();
  };

  $('#inpFlyerPrice').oninput = e => {
    flyerPriceUsd = parseFloat(e.target.value) || 0;
    renderFlyer();
  };

  $('#selFlyerTheme').onchange = e => {
    theme = e.target.value;
    renderFlyer();
  };

  $('#inpFlyerSellerName').oninput = e => {
    sellerName = e.target.value.trim() || 'Servicios Digitales';
    renderFlyer();
  };

  $('#inpFlyerSellerPhone').oninput = e => {
    sellerPhone = e.target.value.trim() || '+58 412 0000000';
    renderFlyer();
  };

  $('#btnDownloadFlyer').onclick = () => {
    const canvas = $('#flyerCanvas');
    if(!canvas) return;
    const a = document.createElement('a');
    a.download = `Flyer-${selectedProduct.nombre.replace(/[^a-zA-Z0-9]/g, '_')}-${sellerName.replace(/[^a-zA-Z0-9]/g, '_')}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('¡Flyer descargado en alta calidad 1080x1080!');
  };

  $('#btnShareFlyerWa').onclick = async () => {
    const cleanNum = sellerPhone.replace(/\D/g, '');
    const curRate = S.rate || 0;
    const priceBs = (flyerPriceUsd * curRate).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const textMsg = `🔥 *OFERTA ESPECIAL: ${selectedProduct.nombre.toUpperCase()}*\n\n⏱️ *Duración:* ${selectedProduct.duracion_dias || 30} Días\n🛡️ *Garantía:* ${selectedProduct.garantia_dias || 30} Días 100% oficial\n⚡ *Activación Inmediata*\n\n💵 *Precio:* $${Number(flyerPriceUsd).toFixed(2)} USD (ó Bs. ${priceBs})\n\n📲 *Pide el tuyo ahora:* https://wa.me/${cleanNum}?text=${encodeURIComponent(`Hola! 👋 Deseo activar ${selectedProduct.nombre} por $${Number(flyerPriceUsd).toFixed(2)} USD.`)}`;
    
    // Intentar copiar imagen al portapapeles si el navegador lo soporta
    const canvas = $('#flyerCanvas');
    if(canvas && navigator.clipboard && window.ClipboardItem){
      try {
        canvas.toBlob(async blob => {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          toast('¡Imagen copiada al portapapeles! Ya puedes pegarla en WhatsApp.');
        });
      } catch(e){}
    }

    const waLink = `https://wa.me/?text=${encodeURIComponent(textMsg)}`;
    window.open(waLink, '_blank');
  };

  fDlg.showModal();
  setTimeout(renderFlyer, 100);
}
window.openFlyerDesignerModal = openFlyerDesignerModal;

    </div>

      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.37 7.31 24 12 24Z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.97 0 12s.46 3.83 1.26 5.42l4.02-3.15Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.63 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/></svg>
      Continuar con Google
    </button>
  `;

  const linksHtml = isReg
    ? `<span>¿Ya tienes cuenta? <a id="facetToggleMode">Inicia sesión</a></span>`
    : `<span>¿Nuevo cliente? <a id="facetToggleMode">Crear cuenta</a></span>`;

  facetDlg.innerHTML = renderFacetShell({title, subtitle, contentHtml, linksHtml});
  $('#facetCloseBtn').onclick = () => facetDlg.close();
  $('#facetToggleMode').onclick = () => loginDlg(isReg ? 'login' : 'register');

  $('#facetGoogle').onclick = () => sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + '/'}});

  if($('#btnAutoDemoAdminClient')){
    $('#btnAutoDemoAdminClient').onclick = () => {
      $('#facetId').value = 'admin.demo@gregoryizquierdo.xyz';
      $('#facetPw').value = 'AdminDemo2026*';
      $('#facetAction').click();
    };
  }

  $('#facetAction').onclick = async () => {
    const inputId = ($('#facetId')?.value || '').trim();
    const pwVal = $('#facetPw')?.value || '';

    if(!inputId) return toast(isReg ? 'Ingresa tu correo electrónico' : 'Ingresa tu correo o teléfono de WhatsApp');
    if(!pwVal || pwVal.length < 6) return toast('La contraseña debe tener al menos 6 caracteres');

    if(isReg){
      if(!inputId.includes('@')) return toast('Debes ingresar un correo electrónico válido (ej: tu@gmail.com).');
      const nombreVal = ($('#facetNm')?.value || '').trim();
      const telVal = ($('#facetTel')?.value || '').trim();
      if(!nombreVal) return toast('Por favor ingresa tu nombre completo');

      const {data, error} = await sb.auth.signUp({
        email: inputId,
        password: pwVal,
        options: {
          data: {
            nombre: nombreVal,
            telefono: telVal
          }
        }
      });

      if(error){
        if(error.message.includes('Phone signups are disabled')){
          return toast('El registro se realiza con correo electrónico o con Google.');
        }
        return toast(error.message);
      }

      // Si tenemos sesion inmediata y telefono, guardarlo en customers
      if(data?.user?.id && telVal){
        try { await sb.from('customers').update({telefono: telVal, nombre: nombreVal}).eq('id', data.user.id); } catch(e){}
      }

      // Notificar nuevo registro a Telegram
      fetch('/api/notify-event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'nuevo_cliente',
          data: {
            nombre: nombreVal,
            email: inputId,
            telefono: telVal
          }
        })
      }).catch(()=>{});

      facetDlg.close();
      toast('Cuenta creada exitosamente. Revisa tu correo si requiere confirmación o inicia sesión.');
    } else {
      let loginEmail = (inputId || '').trim().toLowerCase();
      const isPhone = !loginEmail.includes('@');
      if(isPhone){
        const cleanPhone = loginEmail.replace(/\D/g, '');
        if(cleanPhone.length < 7) return toast('Ingresa un número de WhatsApp válido (ej: 04121234567).');
        loginEmail = `${cleanPhone}@cliente.gregoryizquierdo.xyz`;
      }

      let {error} = await sb.auth.signInWithPassword({
        email: loginEmail,
        password: pwVal
      });

      // Si falló y era teléfono, intentar con variantes comunes (ej. 0412 vs 58412):
      if(error && isPhone){
        const cleanDigits = inputId.replace(/\D/g, '');
        const altPhone = cleanDigits.startsWith('58') ? ('0' + cleanDigits.slice(2)) : (cleanDigits.startsWith('0') ? ('58' + cleanDigits.slice(1)) : ('0' + cleanDigits));
        const altEmail = `${altPhone}@cliente.gregoryizquierdo.xyz`;
        const retry = await sb.auth.signInWithPassword({ email: altEmail, password: pwVal });
        if(!retry.error){
          error = null;
        }
      }

      // Si falló y era correo con error de tipeo en dominio (ej. @gmai.com <-> @gmail.com):
      if(error && !isPhone){
        let altEmail = null;
        if(loginEmail.endsWith('@gmai.com')) altEmail = loginEmail.replace('@gmai.com', '@gmail.com');
        else if(loginEmail.endsWith('@gmail.co')) altEmail = loginEmail.replace('@gmail.co', '@gmail.com');
        else if(loginEmail.endsWith('@gamil.com')) altEmail = loginEmail.replace('@gamil.com', '@gmail.com');
        else if(loginEmail.endsWith('@gmail.com')) altEmail = loginEmail.replace('@gmail.com', '@gmai.com');
        if(altEmail){
          const retry = await sb.auth.signInWithPassword({ email: altEmail, password: pwVal });
          if(!retry.error){
            error = null;
          }
        }
      }

      if(error){
        if(error.message && error.message.includes('Invalid login credentials')){
          return toast(isPhone ? 'Teléfono o contraseña incorrecta. Si es tu primer ingreso, la contraseña son los últimos 6 dígitos de tu WhatsApp.' : 'Correo o contraseña incorrecta.');
        }
        if(error.message && error.message.toLowerCase().includes('database error querying schema')){
          return toast('⚠️ Error de esquema en Supabase Auth. Ejecuta la Migración 34 en el SQL Editor de Supabase para reparar los tokens de acceso.');
        }
        return toast(error.message);
      }

      // Comprobar si requiere cambiar clave por primera vez
      try {
        const { data: { user: u } } = await sb.auth.getUser();
        if(u){
          const m = await sb.from('customers').select('*').eq('id', u.id).maybeSingle();
          if(m?.data) S.me = m.data;
          if(S.me?.debe_cambiar_password === true && !S.isAdmin){
            facetDlg.close();
            forceChangePasswordDlg();
            return;
          }
        }
      } catch(e){}

      facetDlg.close();
      if(S.isAdmin){
        history.replaceState(null, '', location.pathname + '#admin');
        admin('finanzas');
      } else if(S.me?.es_revendedor){
        portal();
      } else {
        home();
      }
    }
  };

  if(!facetDlg.open) facetDlg.showModal();
}

        try { confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } }); } catch(e){}
      }

      toast('¡Contraseña personalizada con éxito! Tu cuenta está blindada. Bienvenido a tu portal.');
      portal();

      btn.disabled = false;
      btn.textContent = '🔒 GUARDAR Y ACTIVAR MI CUENTA';
      toast('Error inesperado: ' + (err.message || err));
    }

  if(!facetDlg.open) facetDlg.showModal();

async function ensureAdminSession(){
  if(S.isAdmin) return true;
  try {
    let { data: { session } } = await sb.auth.getSession();
    if(!session?.user){
      const ref = await sb.auth.refreshSession();
      if(ref?.data?.session) session = ref.data.session;
    } else {
      const exp = session.expires_at || 0;
      const now = Math.floor(Date.now() / 1000);
      if(exp && (exp - now) < 180){
        const ref = await sb.auth.refreshSession();
        if(ref?.data?.session) session = ref.data.session;
      }
    }
    if(!session?.user) return false;
    await onSession(session);
    return !!S.isAdmin;
  } catch(e){
    console.warn('ensureAdminSession error:', e);
    return !!S.isAdmin;
  }
}

const ADMIN_CACHE_TTL = 300000; // 300 segundos = 5 minutos de retención
const adminDataCache = new Map();

function getAdminCache(key){
  const item = adminDataCache.get(key);
  if(!item) return null;
  const isFresh = (Date.now() - item.timestamp) < ADMIN_CACHE_TTL;
  return { ...item, isFresh };
}

function setAdminCache(key, data, error = null){
  adminDataCache.set(key, { timestamp: Date.now(), data, error });
}

function invalidateAdminCache(pattern){
  if(!pattern){
    adminDataCache.clear();
    return;
  }
  for(const k of Array.from(adminDataCache.keys())){
    if(k === pattern || k === 'table_' + pattern || k.startsWith(pattern) || pattern === '*') {
      adminDataCache.delete(k);
    }
  }
}
window.invalidateAdminCache = invalidateAdminCache;

function urlB64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function subscribeDeviceToPush() {
  if (!('Notification' in window)) {
    throw new Error('Este dispositivo o navegador no soporta notificaciones de sistema.');
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    throw new Error('Permiso de notificaciones no concedido en el navegador.');
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return { type: 'local', ok: true };
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    let key = null;
    try {
      const res = await fetch('/api/push-key');
      const data = await res.json();
      key = data?.key;
    } catch(e){}

    if (!key) return { type: 'local', ok: true };

    const pubKeyBytes = urlB64ToUint8Array(key);
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: pubKeyBytes
      });
    }
    const subJson = sub.toJSON();
    await sb.rpc('save_my_push_subscription', {
      p_endpoint: subJson.endpoint,
      p_p256dh: subJson.keys?.p256dh || '',
      p_auth: subJson.keys?.auth || '',
      p_user_agent: navigator.userAgent.slice(0, 140)
    });
    return { type: 'webpush', ok: true, subscription: sub };
  } catch(e) {
    console.warn('Fallo suscripción push avanzada, usando notificaciones de navegador:', e);
    return { type: 'local', ok: true };
  }
}

// Vencimientos del dia: servicios de clientes y cuentas madre para Admin, y vencimientos de sus propios clientes para Revendedores.
async function checkVenc(){
  const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(S.isAdmin){
    const [o,m]=await Promise.all([sb.from('orders').select('id',{count:'exact',head:true}).eq('estado','entregado').eq('vence',d), sb.from('mother_accounts').select('id',{count:'exact',head:true}).eq('activa',true).eq('vence',d)]);
    const a=o.count||0, b=m.count||0, n=a+b; S.venc=n; const k='venc-'+d, prev=+(localStorage.getItem(k)||0);
    if(n>prev){ localStorage.setItem(k,n); notify('venc',`Vencen hoy: ${a} servicio(s) de clientes y ${b} cuenta(s) madre`); } else badge();
  } else if(S.me?.es_revendedor && S.user){
    try {
      const { data: list } = await sb.rpc('my_reseller_clients');
      if(list && Array.isArray(list)){
        const expToday = list.filter(r => r.vence === d && r.estado === 'vendido');
        const count = expToday.length;
        const k = 'reseller-venc-' + d + '-' + S.user.id;
        const prev = +(localStorage.getItem(k) || 0);
        if(count > 0 && count > prev){
          localStorage.setItem(k, count);
          notify('venc', `⏰ Vencimientos de hoy: Tienes ${count} cliente(s) con suscripción por vencer hoy (${d}). Revisa tu portal para renovar o reportar.`);
        }
      }
    } catch(e){}
  }
}
setInterval(checkVenc,3600000);
