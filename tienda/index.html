<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#030812;--card:#0a1628;--line:#16335a;--tx:#ecf6ff;--mut:#8ea8c8;--a:#00f5a0;--g:#00f5a0;--c:#00d4ff;--b:#2563ff;--grad:linear-gradient(135deg,#00f5a0 0%,#00d4ff 48%,#2563ff 100%);--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--bg);background-image:radial-gradient(1200px 600px at 8% -10%,rgba(0,245,160,.16),transparent 60%),radial-gradient(900px 520px at 100% 0%,rgba(37,99,255,.28),transparent 60%);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(3,8,18,.72);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid rgba(0,212,255,.14)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#ffffff;box-shadow:0 0 16px rgba(0,245,160,.4),0 0 6px rgba(255,255,255,.9);border:1.5px solid rgba(0,212,255,.5);flex-shrink:0;padding:2px}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
h1{font-size:1rem;margin:0;font-weight:800}.rate{font-size:.74rem;color:var(--mut)}
main{max-width:1160px;margin:auto;padding:18px 16px 90px}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:rgba(7,19,38,.9);border:1px solid var(--line);border-radius:12px;padding:11px 13px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px rgba(0,212,255,.18)}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#03121c;background:var(--grad);box-shadow:0 6px 22px -8px rgba(0,212,255,.6);transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 10px 28px -8px rgba(0,245,160,.6)}button:active{transform:none}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
button.g{background:rgba(255,255,255,.04);color:var(--tx);border:1px solid var(--line);box-shadow:none}button.g:hover{border-color:var(--c);box-shadow:0 0 0 3px rgba(0,212,255,.12)}
button.d{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hide{display:none!important}.mut{color:var(--mut);font-size:.85rem}
.card{background:linear-gradient(180deg,rgba(13,29,54,.85),rgba(8,18,34,.85));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.price{font-size:1.55rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{padding:3px 10px;border-radius:99px;background:rgba(0,245,160,.12);color:var(--g);font-size:.74rem;font-weight:700}.pill.off{background:rgba(255,77,109,.14);color:#ff7b93}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{border-bottom:1px solid rgba(22,51,90,.8);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px}tr:hover td{background:rgba(0,212,255,.04)}.wrap{overflow-x:auto;border-radius:12px}
dialog{background:linear-gradient(180deg,#0c1b33,#081224);color:var(--tx);border:1px solid rgba(0,212,255,.3);border-radius:20px;max-width:460px;width:92%;box-shadow:0 30px 80px -20px rgba(0,212,255,.35);padding:20px}dialog::backdrop{background:rgba(2,6,14,.72);backdrop-filter:blur(4px)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:36px 24px;margin-bottom:20px;border:1px solid rgba(0,212,255,.25);background:radial-gradient(700px 320px at 50% 0%,rgba(0,245,160,.2),transparent 70%),radial-gradient(800px 360px at 50% 100%,rgba(37,99,255,.32),transparent 70%),linear-gradient(180deg,#081a33,#050e1d);display:flex;flex-direction:column;align-items:center;text-align:center}
.hero h2{margin:0 0 10px;font-size:clamp(1.6rem,5vw,2.5rem);line-height:1.18;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:820px}
.hero p{margin:0 0 18px;color:var(--mut);max-width:680px;font-size:1rem;line-height:1.4}
.hero-rate-box{background:linear-gradient(135deg,rgba(10,26,50,.92) 0%,rgba(5,15,30,.96) 100%);border:1.5px solid rgba(0,212,255,.45);border-radius:18px;padding:12px 24px;margin:4px auto 20px;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 24px rgba(0,212,255,.2);display:inline-flex;align-items:center;gap:10px;transition:transform .2s ease,box-shadow .2s ease}
.hero-rate-box:hover{transform:scale(1.02);box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 32px rgba(0,245,160,.3);border-color:var(--a)}
.hero-rate-icon{font-size:1.35rem;line-height:1}
.hero-rate-text{font-size:1.05rem;font-weight:800;letter-spacing:.3px;color:var(--tx)}
.hero-rate-text b{color:var(--c);font-weight:800}
.hero-rate-text span.rate-date{color:var(--mut);font-weight:600;font-size:.85rem;margin-left:4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chips span{font-size:.82rem;font-weight:700;padding:7px 15px;border-radius:99px;border:1px solid rgba(0,245,160,.35);background:rgba(0,245,160,.08);color:#baffe4;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.search{max-width:520px;width:100%;margin:0 auto;text-align:center;font-size:.95rem;padding:13px 18px;border-radius:16px;background:rgba(7,19,38,.92);border:1.5px solid rgba(0,212,255,.25);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.search:focus{text-align:left;border-color:var(--c);box-shadow:0 0 0 3px rgba(0,212,255,.25),0 0 20px rgba(0,212,255,.3)}
.ban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-bottom:16px;scrollbar-width:none}.ban::-webkit-scrollbar{display:none}
.ban a,.ban div{flex:0 0 100%;scroll-snap-align:start;border-radius:20px;min-height:170px;padding:22px;background:linear-gradient(135deg,#0a3b4a,#12307a) center/cover;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(0,212,255,.25)}.ban h3{margin:0 0 4px;font-size:1.3rem}.ban p{margin:0;opacity:.92}

/* Banner Destacado Superior Tarjeta */
.banner-promo-card{position:relative;overflow:hidden;border-radius:24px;margin-bottom:20px;border:1.5px solid rgba(0,212,255,.35);background:radial-gradient(ellipse at top,#0c2340 0%,#030914 70%);box-shadow:0 16px 45px -10px rgba(0,0,0,.7),0 0 30px -5px rgba(0,212,255,.25)}
.banner-promo-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 24px;text-align:center}
.banner-promo-img-box{position:relative;max-width:440px;width:100%;margin:0 auto 16px;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.85),0 0 20px rgba(0,245,160,.2);display:flex;justify-content:center;align-items:center;background:#050d1a}
.banner-promo-img{width:100%;height:auto;max-height:260px;object-fit:contain;object-position:center;display:block;transition:transform .3s ease}
.banner-promo-card:hover .banner-promo-img{transform:scale(1.02)}
.banner-promo-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:99px;font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(135deg,rgba(0,245,160,.2),rgba(0,212,255,.2));color:#00f5a0;border:1px solid rgba(0,245,160,.4);margin-bottom:8px}
.banner-promo-title{font-size:clamp(1.2rem,3.5vw,1.6rem);font-weight:800;margin:0 0 4px;background:linear-gradient(135deg,#ffffff 0%,#ecf6ff 60%,#00d4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.banner-promo-sub{margin:0;font-size:.92rem;font-weight:600;color:#00d4ff;letter-spacing:1px;text-shadow:0 0 12px rgba(0,212,255,.4)}
.banner-promo-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:70%;background:radial-gradient(circle,rgba(0,212,255,.18) 0%,transparent 70%);filter:blur(30px);pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,rgba(13,29,54,.9),rgba(7,16,30,.95));border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .25s}
.pc:hover{transform:translateY(-4px);border-color:rgba(0,245,160,.55);box-shadow:0 18px 50px -18px rgba(0,245,160,.45)}
.pc img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.ph{display:grid;place-items:center;font-size:3rem;font-weight:800;color:#03121c;background:var(--grad)}
.pb{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}.pb h3{margin:0;font-size:1.05rem}.pb p{margin:0;min-height:1.2em}
.tag{align-self:flex-start;font-size:.68rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#03121c;background:var(--grad)}
.t-cuenta_completa .tag{background:linear-gradient(135deg,#00d4ff,#2563ff);color:#fff}.t-servicio .tag{background:linear-gradient(135deg,#00f5a0,#00d4ff)}
.meta{display:flex;gap:12px;font-size:.78rem;color:var(--mut)}.buy{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:8px}.sub{font-size:.74rem;color:var(--mut)}.cta{padding:10px 18px}.empty{padding:40px 10px;text-align:center;grid-column:1/-1}
.sk{border-radius:20px;min-height:280px;background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(0,212,255,.10) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}@keyframes sh{to{background-position:-200% 0}}
.float-acts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:10px}
.wa,.tg{border-radius:99px;text-decoration:none;padding:11px 16px;font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;gap:7px;box-shadow:0 10px 30px -6px rgba(0,0,0,.6);transition:transform .18s ease,box-shadow .2s ease}
.wa{color:#03121c;background:linear-gradient(135deg,#00f5a0,#00d4ff);box-shadow:0 10px 30px -6px rgba(0,245,160,.7)}
.wa:hover{transform:translateY(-2px);box-shadow:0 14px 34px -6px rgba(0,245,160,.9)}
.tg{color:#ffffff;background:linear-gradient(135deg,#229ed9,#0088cc);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px -6px rgba(34,158,217,.7)}
.tg:hover{transform:translateY(-2px);box-shadow:0 14px 34px -6px rgba(34,158,217,.9)}
.wa svg,.tg svg{width:18px;height:18px;display:block}
@media(max-width:560px){header{padding:8px 12px}.hero{padding:26px 16px;border-radius:20px}main{padding:14px 12px 90px}.float-acts{right:10px;bottom:calc(10px + env(safe-area-inset-bottom));gap:8px}.wa,.tg{padding:9px 13px;font-size:.78rem}}
body.is-admin main{max-width:100%!important;width:100%!important;padding:0!important;margin:0!important}
.admin-wrapper{display:flex;flex-direction:column;width:100%}
.admin-layout{display:grid;grid-template-columns:270px 1fr;gap:0;align-items:start;min-height:calc(100vh - 66px)}
.admin-sidebar{position:sticky;top:66px;height:calc(100vh - 66px);max-height:calc(100vh - 66px);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(7,16,32,.98),rgba(3,8,18,.99));border-right:1px solid var(--line);border-top:0;border-bottom:0;border-left:0;border-radius:0;box-shadow:8px 0 24px -10px rgba(0,0,0,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;z-index:10}
.admin-sidebar-head{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(22,51,90,.8);background:rgba(3,8,18,.6)}
.admin-sidebar-brand{display:flex;align-items:center;gap:10px}
.admin-sb-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffffff;box-shadow:0 0 12px rgba(0,245,160,.4);border:1px solid rgba(0,212,255,.4);flex-shrink:0;overflow:hidden;padding:1px}
.admin-sb-icon img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.admin-sb-title{font-weight:800;font-size:.92rem;color:var(--tx);line-height:1.15}
.admin-sb-sub{font-size:.68rem;color:var(--mut)}
.admin-sidebar-close{display:none;padding:4px 8px;font-size:.85rem}
.admin-nav-scroll{overflow-y:auto;padding:10px 10px 24px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.25) transparent}
.admin-nav-scroll::-webkit-scrollbar{width:5px}
.admin-nav-scroll::-webkit-scrollbar-thumb{background:rgba(0,212,255,.25);border-radius:99px}
.admin-sb-group{font-size:.68rem;font-weight:800;letter-spacing:.75px;text-transform:uppercase;color:var(--c);opacity:.85;padding:12px 10px 4px}
.admin-sb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:10px;font-size:.82rem;font-weight:600;text-align:left;background:transparent;color:var(--mut);border:1px solid transparent;box-shadow:none;cursor:pointer;transition:all .16s ease}
.admin-sb-btn:hover{background:rgba(0,212,255,.08);color:var(--tx);border-color:rgba(0,212,255,.18);transform:translateX(2px)}
.admin-sb-btn.active{background:linear-gradient(135deg,rgba(0,245,160,.14) 0%,rgba(0,212,255,.2) 100%);color:#fff;border-color:rgba(0,245,160,.4);border-left:3px solid var(--a);box-shadow:0 4px 16px -2px rgba(0,212,255,.3);font-weight:700;transform:none}
.admin-sb-btn-main{display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-sb-btn-icon{font-size:.92rem;line-height:1}
.admin-sb-badge{padding:2px 7px;border-radius:99px;font-size:.68rem;font-weight:800;background:rgba(0,245,160,.16);color:var(--a);border:1px solid rgba(0,245,160,.3);flex-shrink:0}
.admin-sb-badge.warn{background:rgba(255,77,109,.18);color:#ff7b93;border-color:rgba(255,77,109,.35)}
.admin-main{display:flex;flex-direction:column;gap:14px;min-width:0;padding:18px 24px 60px}
.admin-main-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 18px;background:linear-gradient(180deg,rgba(13,29,54,.85),rgba(8,18,34,.85));border:1px solid var(--line);border-radius:var(--r)}
.admin-main-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.admin-main-title h2{margin:0;font-size:1.25rem;font-weight:800}
.admin-mobile-bar{display:none;margin:10px 14px 4px}
.admin-mobile-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(13,29,54,.95),rgba(8,18,34,.95));border:1px solid rgba(0,212,255,.25);color:var(--tx);font-size:.88rem;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.admin-backdrop{display:none;position:fixed;inset:0;background:rgba(3,8,18,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40}
@media(max-width:880px){
  .admin-layout{grid-template-columns:1fr;min-height:auto}
  .admin-main{padding:12px 14px 70px}
  .admin-mobile-bar{display:block}
  .admin-sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-height:100vh;height:100vh;border-radius:0 20px 20px 0;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:50;box-shadow:0 0 50px rgba(0,0,0,.8)}
  .admin-sidebar.open{transform:translateX(0)}
  .admin-sidebar-close{display:block}
  .admin-backdrop.open{display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Modal Login Estilo Gema Poligonal Futurista */
.facet-dialog{border:0;background:transparent;padding:0;overflow:visible;max-width:440px;width:94%;box-shadow:none}
.facet-dialog::backdrop{background:rgba(2,6,15,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.facet-card{position:relative;margin:24px auto;padding:48px 36px 36px;color:#fff;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,#0a1526 0%,#030711 55%,#050f1d 100%);filter:drop-shadow(0 20px 45px rgba(0,0,0,.9)) drop-shadow(0 0 24px rgba(0,212,255,.28));clip-path:polygon(32% 0%,68% 0%,100% 24%,100% 76%,68% 100%,32% 100%,0% 76%,0% 24%)}
.facet-card::before{content:"";position:absolute;inset:1px;background:linear-gradient(135deg,rgba(0,245,160,.08) 0%,rgba(0,212,255,.05) 50%,rgba(5,13,26,.95) 100%);clip-path:polygon(32% 0%,68% 0%,100% 24%,100% 76%,68% 100%,32% 100%,0% 76%,0% 24%);pointer-events:none;z-index:1}
.facet-shine{position:absolute;top:0;left:0;width:55%;height:100%;background:linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 45%,transparent 65%);clip-path:polygon(0 0,60% 0,0 80%);pointer-events:none;z-index:2}
.facet-glow-top{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.8),transparent);box-shadow:0 0 12px #00d4ff;pointer-events:none}
.facet-glow-corner{position:absolute;bottom:12%;left:8%;width:60px;height:60px;background:radial-gradient(circle,rgba(0,212,255,.45) 0%,transparent 70%);filter:blur(6px);pointer-events:none}
.facet-content{position:relative;z-index:3;width:100%;display:flex;flex-direction:column;align-items:center}
.facet-title{font-family:Sora,sans-serif;font-size:1.85rem;font-weight:300;letter-spacing:9px;text-indent:9px;color:#ecf6ff;text-transform:uppercase;margin:0 0 4px;text-align:center;text-shadow:0 0 16px rgba(0,212,255,.5)}
.facet-sub{font-size:.76rem;letter-spacing:2px;color:rgba(142,168,200,.8);text-transform:uppercase;margin:0 0 20px;text-align:center}
.facet-input-wrap{width:100%;margin-bottom:12px;position:relative}
.facet-input{width:100%;box-sizing:border-box;background:#e7edf5!important;color:#0b192e!important;border:none!important;border-radius:24px!important;padding:12px 20px!important;font-size:.85rem!important;font-weight:600!important;letter-spacing:1.5px!important;text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.4);transition:all .2s ease}
.facet-input::placeholder{color:#768b9f;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;font-size:.78rem}
.facet-input:focus{outline:none;background:#ffffff!important;box-shadow:0 0 0 3px rgba(0,212,255,.55),0 0 18px rgba(0,212,255,.45)!important}
.facet-btn{width:auto;min-width:140px;margin-top:10px;padding:9px 28px;border-radius:24px;border:1px solid rgba(0,212,255,.6);background:linear-gradient(180deg,rgba(10,35,66,.85) 0%,rgba(3,15,32,.95) 100%);color:#00d4ff;font-size:.82rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;box-shadow:0 0 14px rgba(0,212,255,.3),inset 0 0 8px rgba(0,212,255,.2);cursor:pointer;transition:all .2s ease}

function detectSubdomain(){
  const host = window.location.hostname.toLowerCase();
  const parts = host.split('.');
  // Ignora localhost, 127.0.0.1, y hosts sin subdominio o www
  if(parts.length <= 2 || host === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(host)) return null;
  const sub = parts[0];
  if(['www', 'tienda', 'app', 'panel', 'admin'].includes(sub)) return null;
  return sub;
}

}

async function onSession(session){
  if(session?.provider_token) sessionStorage.setItem('gtk',session.provider_token);
  const prevUser = S.user;
  const isSameUser = prevUser && session?.user && prevUser.id === session.user.id;
  S.user = session?.user||null;
  if(!S.user){
    S.me = null; S.isAdmin = false;
  } else {
    if(!isSameUser) S.isAdmin = false;
    const email = (S.user.email||'').toLowerCase();
    const isGoogle = S.user.app_metadata?.provider === 'google' || (S.user.identities||[]).some(x=>x.provider==='google');
    const isKnown = email === 'emprendimientogregoryizquierdo@gmail.com' || (S.settings.negocio?.correo && email === String(S.settings.negocio.correo).toLowerCase());
    try {
      const [m, a, rpc] = await Promise.all([
        sb.from('customers').select('*').eq('id',S.user.id).maybeSingle(),
        sb.from('admins').select('email').ilike('email', email).maybeSingle().catch(()=>({data:null})),
        sb.rpc('is_admin').catch(()=>({data:null}))
      ]);
      S.me = m?.data || S.me;
      S.isAdmin = Boolean(rpc?.data === true || a?.data || (isKnown && isGoogle));
      sb.from('login_log').insert({customer_id:S.user.id,email:S.user.email,user_agent:navigator.userAgent}).then(()=>{});
    } catch(err) {
      if(isKnown && isGoogle) S.isAdmin = true;
    }
  }
  $('#bLogin').classList.toggle('hide',!!S.user);
  $('#bRegister').classList.toggle('hide',!!S.user);
  $('#bOut').classList.toggle('hide',!S.user);
  $('#bPortal').classList.toggle('hide',!S.user);
  // El boton Admin esta visible si es admin o si no hay sesion iniciada (para que el admin pueda autenticarse mediante Opcion B)
  $('#bAdmin').classList.toggle('hide',Boolean(S.user && !S.isAdmin));
  $('#bSnd').classList.toggle('hide',!S.isAdmin); updSnd(); badge(); checkVenc();
}
document.addEventListener('visibilitychange', async () => {
  if(!document.hidden && S.user){
    try {
      const { data: { session } } = await sb.auth.getSession();
      if(session){
        const exp = session.expires_at || 0;
        const now = Math.floor(Date.now() / 1000);
        if(exp && (exp - now) < 300) {
          const ref = await sb.auth.refreshSession();
          if(ref?.data?.session) await onSession(ref.data.session);
        } else {
          await onSession(session);
        }
      }
    } catch(e){}
  }
});

function productCard(p){
  const isReseller = S.me?.es_revendedor === true;
  const originalPrice = Number(p.precio_usd);
  // Precio mayorista: si el producto tiene precio_revendedor_usd lo usa; sino calcula un 15% de descuento mayorista por defecto
  const effectivePrice = isReseller
    ? (p.precio_revendedor_usd != null && Number(p.precio_revendedor_usd) > 0 ? Number(p.precio_revendedor_usd) : Math.round((originalPrice * 0.85) * 100) / 100)
    : originalPrice;

  const out=!(S.stock[p.id]>0||p.tipo==='servicio'), bs=S.cur==='USD'&&S.rate?`<div class="sub">≈ Bs. ${(effectivePrice*S.rate).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>`:'';
  
  return `<article class="pc t-${esc(p.tipo)}">${p.imagen_url?`<img src="${esc(p.imagen_url)}" alt="" loading="lazy" decoding="async">`:`<div class="ph" aria-hidden="true">${esc((p.nombre||'?').slice(0,1).toUpperCase())}</div>`}
   <div class="pb">
     <div style="display:flex;justify-content:space-between;align-items:center">
       <span class="tag">${esc(TL[p.tipo]||p.tipo)}</span>
       ${isReseller ? '<span class="reseller-badge">VIP Revendedor</span>' : ''}
     </div>
     <h3>${esc(p.nombre)}</h3><p class="mut">${esc(p.descripcion)}</p>
     <div class="meta"><span>⏱ ${p.duracion_dias} días</span><span>🛡 Garantía ${p.garantia_dias||0} días</span></div>
     <div class="buy">
       <div>
         <div class="price">
           ${isReseller ? `<span class="reseller-orig-price">$${originalPrice.toFixed(2)}</span>` : ''}
           ${money(effectivePrice)}
           ${isReseller ? `<span class="reseller-price-tag">Mayorista</span>` : ''}
         </div>
         ${bs}
       </div>
       ${out?'<span class="pill off">Agotado</span>':`<button class="cta" data-buy="${p.id}">Comprar</button>`}
     </div>
   </div></article>`;
}
function renderGrid(){

  g.innerHTML=list.map(productCard).join('')||'<p class="mut empty">Aún no hay productos disponibles. Vuelve pronto.</p>';
  g.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyDlg(b.dataset.buy));
}

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.37.75-.56 2.94-1.28 4.91-2.12 5.9-2.54 2.81-1.17 3.39-1.38 3.77-1.38.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .37z"/></svg>

const PAYMENT_ICONS = {
  'pago movil': '📱',
  'pago móvil': '📱',
  'transferencia': '🏦',
  'depósito': '🏧',
  'deposito': '🏧',
  'binance': '🟡',
  'binance usdt': '🟡',
  'zinli': '🟣',
  'zelle': '💜',
  'efectivo': '💵',
  'punto de venta': '💳',
  'biopago': '☝️'
};

function getPaymentIcon(name=''){
  const n = name.toLowerCase().trim();
  for(const [k, icon] of Object.entries(PAYMENT_ICONS)){
    if(n.includes(k)) return icon;
  }
  return '💳';
}

async function buyDlg(id){
  if(!S.user) return loginDlg('login');
  const p = S.products.find(x => x.id === id);
  if(!p) return toast('Producto no encontrado');

  const [{data: pmList}, {data: h}, {data: userCard}] = await Promise.all([
    sb.from('payment_methods').select('*').eq('activo', true).order('orden'),
    sb.from('zeny_ledger').select('monto').eq('tipo', 'compra').eq('estado', 'pendiente'),
    sb.from('zeny_cards').select('*').eq('customer_id', S.user.id).maybeSingle().catch(()=>({data:null}))
  ]);

  const hasActiveCard = userCard && userCard.estado === 'activa';
  const availZeny = Math.max(0, Number(S.me?.zeny_balance || 0) + (h || []).reduce((a, x) => a + Number(x.monto), 0));
  const maxZeny = Math.min(availZeny, Number(p.precio_usd));
  let currentStep = 'method'; // 'method' (Paso 1) o 'details' (Paso 2)
  let payPlan = 'contado'; // 'contado' o 'cuotas'
  let selectedMethodId = (pmList && pmList.length > 0) ? pmList[0].id : null;
  let appliedZeny = 0;

  // Calculos de precio (Minorista o Mayorista si es Revendedor)
  const isReseller = S.me?.es_revendedor === true;
  const standardPrice = Number(p.precio_usd);
  const totalOriginal = isReseller
    ? (p.precio_revendedor_usd != null && Number(p.precio_revendedor_usd) > 0 ? Number(p.precio_revendedor_usd) : Math.round((standardPrice * 0.85) * 100) / 100)
    : standardPrice;

  const isBnplEligible = totalOriginal >= 5; // Aplica para montos desde $5 en adelante
  const cuotaInicialUsd = Math.round((totalOriginal * 0.5) * 100) / 100;
  const cuotaDosUsd = Math.round((totalOriginal - cuotaInicialUsd) * 100) / 100;

  const dateNow = new Date();
  const d1Str = dateNow.toISOString().slice(0, 10);
  const d2 = new Date(dateNow.getTime() + 15 * 86400000);
  const d2Str = d2.toISOString().slice(0, 10);

  // Parsea datos estructurados: si viene como objeto los usa; si el administrador guardó todo en un solo texto o nombre lo divide en cajones limpios
  const parseMethodFields = (method) => {
    if(!method) return [];
    const rawData = method.datos || {};
    let fields = [];

    if(typeof rawData === 'object' && Object.keys(rawData).length > 0){
      for(const [k, v] of Object.entries(rawData)){
        if(v != null && String(v).trim()) fields.push({ label: k, value: String(v).trim() });
      }
    }

    if(fields.length <= 1){
      const combinedText = [fields[0]?.value || '', method.nombre || '', method.tipo || ''].join(' ');
      const parsed = [];
      const bankMatch = combinedText.match(/(?:banco|bnc|banesco|mercantil|venezuela|provincial|bod|bancaribe|exterior|activo)\s*(?:\d{4})?/i);
      if(bankMatch) parsed.push({ label: 'Banco', value: bankMatch[0].trim() });
      else if(method.nombre && !/04\d{2}/.test(method.nombre)) parsed.push({ label: 'Método', value: method.nombre });

      const phoneMatch = combinedText.match(/(?:04\d{2}[\s.-]?\d{7}|4\d{2}[\s.-]?\d{7}|\+58[\s.-]?\d{10})/);
      if(phoneMatch) parsed.push({ label: 'Celular / Teléfono', value: phoneMatch[0].replace(/[\s.-]/g, '') });

      const docMatch = combinedText.match(/([VvJjEeGg][\s.-]?\d{6,9}|\b\d{7,8}\b)/);
      if(docMatch) parsed.push({ label: 'RIF / Cédula', value: docMatch[0].toUpperCase().replace(/[\s.-]/g, '') });

      if(parsed.length >= 2){
        fields = parsed;
      }
    }

    if(fields.length === 0){
      fields.push({ label: 'Datos de la cuenta', value: method.nombre });
    }

    return fields;
  };

  const renderCheckout = () => {
    const totalToPayToday = payPlan === 'cuotas' ? cuotaInicialUsd : totalOriginal;
    const restUsd = Math.max(0, totalToPayToday - appliedZeny);
    const restBs = restUsd * (S.rate || 0);
    const isFullZeny = restUsd <= 0;
    const selectedMethod = (pmList || []).find(m => m.id === selectedMethodId) || (pmList || [])[0];

    // PASO 1: SELECCIÓN DEL MÉTODO DE PAGO
    if(currentStep === 'method'){
      const methodsHtml = (pmList || []).map(m => {
        const isSel = m.id === selectedMethodId;
        const icon = getPaymentIcon(m.nombre);
        let displayTitle = m.nombre;
        if(/pago\s*m[oó]vil/i.test(m.nombre) || /pago\s*m[oó]vil/i.test(m.tipo || '')) displayTitle = 'Pago Móvil';
        else if(/transferencia/i.test(m.nombre)) displayTitle = 'Transferencia Bancaria';
        else if(/binance/i.test(m.nombre)) displayTitle = 'Binance USDT';
        else if(/zinli/i.test(m.nombre)) displayTitle = 'Zinli';
        else if(/zelle/i.test(m.nombre)) displayTitle = 'Zelle';

        return `
          <div class="checkout-method-card ${isSel ? 'active' : ''}" data-pm-choose="${m.id}">
            <div class="checkout-method-left">
              <div class="checkout-method-icon">${icon}</div>
              <div>
                <div class="checkout-method-name">${esc(displayTitle)}</div>
                <div class="checkout-method-type">Toca para ver los datos bancarios</div>
              </div>
            </div>
            <div class="checkout-method-arrow" style="font-size:1.2rem;font-weight:800">›</div>
          </div>
        `;
      }).join('');

      checkoutDlg.innerHTML = `
        <div class="checkout-card">
          <div class="checkout-top-bar">
            <div style="width:28px"></div>
            <div class="checkout-progress-bar"><div class="checkout-progress-fill" style="width:50%"></div></div>
            <button class="checkout-close-btn" id="coCloseBtn" type="button">✕</button>
          </div>

          <div class="checkout-body">
            <!-- Selector de Modalidad: De Contado vs En Cuotas (BNPL) -->
            ${isBnplEligible ? `
              <div class="paymode-tabs">
                <button class="paymode-tab ${payPlan === 'contado' ? 'active' : ''}" id="pmPlanContado" type="button">
                  <span>💵 Pago Total</span>
                </button>
                <button class="paymode-tab ${payPlan === 'cuotas' ? 'active' : ''}" id="pmPlanCuotas" type="button">
                  <span>📅 En 2 Cuotas</span>
                  <span class="bnpl-badge" style="font-size:.65rem">Inicial $${cuotaInicialUsd}</span>
                </button>
              </div>
            ` : ''}

            <!-- Resumen de compra -->
            <div class="checkout-summary-box">
              <div class="checkout-summary-row">
                <span>Producto</span>
                <b>${esc(p.nombre)}</b>
              </div>
              <div class="checkout-summary-row">
                <span>Modalidad</span>
                <span style="font-weight:700;color:${payPlan === 'cuotas' ? 'var(--a)' : 'var(--tx)'}">
                  ${payPlan === 'cuotas' ? '✨ Financiamiento en 2 Cuotas' : 'Contado (Pago único)'}
                </span>
              </div>
              ${payPlan === 'cuotas' ? `
                <div class="bnpl-schedule">
                  <div class="bnpl-schedule-title">
                    <span>Cronograma de Cuotas</span>
                    <span>Total: $${totalOriginal.toFixed(2)}</span>
                  </div>
                  <div class="bnpl-schedule-list">
                    <div class="bnpl-schedule-item today">
                      <div>
                        <span class="item-title">1. Inicial (Hoy)</span>
                        <span class="item-date">${d1Str} · Activa tu servicio</span>
                      </div>
                      <span class="item-price">$${cuotaInicialUsd.toFixed(2)} USD</span>
                    </div>
                    <div class="bnpl-schedule-item">
                      <div>
                        <span class="item-title">2. Segunda Cuota</span>
                        <span class="item-date">Vence en 15 días (${d2Str})</span>
                      </div>
                      <span class="item-price">$${cuotaDosUsd.toFixed(2)} USD</span>
                    </div>
                  </div>
                </div>
              ` : ''}
              ${maxZeny > 0 ? `
                <div style="margin:10px 0 6px;padding:8px 10px;background:rgba(7,19,38,.85);border:1px solid var(--line);border-radius:12px">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                    <span style="font-size:.78rem;font-weight:700;color:var(--tx)">💰 Billetera Zeny</span>
                    <span style="font-size:.74rem;color:var(--c)">Disponibles: ${availZeny.toFixed(2)} ZP</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px">
                    <input id="coZenyInput" type="number" min="0" max="${Math.min(maxZeny, totalToPayToday)}" step="0.01" value="${appliedZeny}" style="background:rgba(12,28,52,.9);padding:6px 10px;font-size:.85rem;border-radius:8px">
                    <button class="g" id="coMaxZeny" type="button" style="padding:6px 10px;font-size:.75rem">Usar todo</button>
                  </div>
                </div>
              ` : ''}
              ${hasActiveCard && availZeny >= totalToPayToday ? `
                <div style="margin:12px 0;padding:12px 14px;background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(5,7,12,.9));border:1.5px solid rgba(234,179,8,.45);border-radius:14px">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                    <span style="font-size:.78rem;font-weight:800;color:#fde047;letter-spacing:1px">💳 PAGO CON TARJETA ZENY</span>
                    <span class="pill" style="font-size:.65rem;background:rgba(234,179,8,.2);color:#fde047">Activa</span>
                  </div>
                  <div style="font-size:.82rem;color:#e2e8f0;margin-bottom:10px">
                    N°: <b>${esc(userCard.numero_tarjeta)}</b> · Titular: <b>${esc(userCard.nombre_titular)}</b>
                  </div>
                  <button id="coPayCardDirectBtn" type="button" style="width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-weight:800;padding:10px;border-radius:10px;box-shadow:0 4px 14px rgba(245,158,11,.4)">
                    ⚡ Pagar $${totalToPayToday.toFixed(2)} USD con mi Tarjeta Zeny
                  </button>
                </div>
              ` : ''}
              <div class="checkout-summary-total">
                <div>
                  <span style="font-size:.76rem;color:var(--mut);display:block">
                    ${payPlan === 'cuotas' ? 'Monto a pagar hoy (Inicial):' : 'Total a transferir:'}
                  </span>
                  <span class="price-usd">$${restUsd.toFixed(2)} USD</span>
                </div>
                ${S.rate ? `<span class="price-bs">≈ Bs. ${restBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>` : ''}
              </div>
            </div>

            <!-- Metodos de pago -->
            ${!isFullZeny ? `
              <div class="checkout-methods-title">
                <span>¿Cómo vas a pagar?</span>
                <span style="font-size:.75rem;color:var(--mut);font-weight:500">Selecciona tu método</span>
              </div>
              <div class="checkout-methods-grid">
                ${methodsHtml || '<p class="mut">No hay métodos activos en este momento.</p>'}
              </div>
            ` : `
              <div class="checkout-bank-details" style="background:rgba(0,245,160,.1);border:1px solid rgba(0,245,160,.3);padding:12px;border-radius:14px">
                <h4 style="color:var(--a);margin:0 0 6px">✅ Pago cubierto totalmente con Zeny</h4>
                <p class="mut" style="color:#baffe4;font-size:.8rem;margin:0">
                  Se aplicarán <b>$${appliedZeny.toFixed(2)} ZenyPoints</b>. No requieres transferir por banco.
                </p>
              </div>
              <button id="coSubmitZenyBtn" class="checkout-submit-btn" style="margin-top:14px" type="button">
                Confirmar ${payPlan === 'cuotas' ? 'Inicial en Cuotas' : 'Pedido'} con Zeny
              </button>
            `}
          </div>
        </div>
      `;

      $('#coCloseBtn').onclick = () => checkoutDlg.close();

      const btnPlanContado = $('#pmPlanContado');
      if(btnPlanContado) btnPlanContado.onclick = () => { payPlan = 'contado'; appliedZeny = 0; renderCheckout(); };
      const btnPlanCuotas = $('#pmPlanCuotas');
      if(btnPlanCuotas) btnPlanCuotas.onclick = () => { payPlan = 'cuotas'; appliedZeny = 0; renderCheckout(); };

      checkoutDlg.querySelectorAll('[data-pm-choose]').forEach(el => {
        el.onclick = () => {
          selectedMethodId = el.dataset.pmChoose;
          currentStep = 'details';
          renderCheckout();
        };
      });

      const zyInput = $('#coZenyInput');
      if(zyInput){
        zyInput.oninput = () => {
          appliedZeny = Math.min(Math.max(0, Number(zyInput.value) || 0), Math.min(maxZeny, totalToPayToday));
          renderCheckout();
        };
      }
      const maxZyBtn = $('#coMaxZeny');
      if(maxZyBtn){
        maxZyBtn.onclick = () => {
          appliedZeny = Math.min(maxZeny, totalToPayToday);
          renderCheckout();
        };
      }

      const zenySubmit = $('#coSubmitZenyBtn');
      if(zenySubmit){
        zenySubmit.onclick = async () => {
          zenySubmit.disabled = true;
          const refText = payPlan === 'cuotas' ? `Inicial Cuota 1 (Zeny)` : 'Pago completo Zeny';
          const {data: ordId, error} = await sb.rpc('create_order', {
            p_product: id,
            p_metodo: null,
            p_ref: refText,
            p_zeny: appliedZeny
          });
          if(error){
            zenySubmit.disabled = false;
            return toast(error.message);
          }

          if(payPlan === 'cuotas' && ordId){
            // Registrar las 2 cuotas en installments
            await sb.from('installments').insert([
              { order_id: ordId, customer_id: S.user.id, numero_cuota: 1, total_cuotas: 2, monto_usd: cuotaInicialUsd, fecha_vencimiento: d1Str, estado: 'en_revision', referencia: 'Zeny inicial' },
              { order_id: ordId, customer_id: S.user.id, numero_cuota: 2, total_cuotas: 2, monto_usd: cuotaDosUsd, fecha_vencimiento: d2Str, estado: 'pendiente' }
            ]).catch(()=>{});
          }

          checkoutDlg.close();
          await loadPublic();
          toast(payPlan === 'cuotas' ? 'Inicial enviada. Tus cuotas quedaron agendadas en tu portal.' : 'Pedido enviado con Zeny.');
          portal();
        };
      }

      const cardDirectBtn = $('#coPayCardDirectBtn');
      if(cardDirectBtn){
        cardDirectBtn.onclick = async () => {
          cardDirectBtn.disabled = true;
          const refCard = `[TDC Zeny] ${userCard.numero_tarjeta}`;
          const {data: ordId, error} = await sb.rpc('create_order', {
            p_product: id,
            p_metodo: null,
            p_ref: refCard,
            p_zeny: totalToPayToday
          });
          if(error){
            cardDirectBtn.disabled = false;
            return toast(error.message);
          }

          if(payPlan === 'cuotas' && ordId){
            await sb.from('installments').insert([
              { order_id: ordId, customer_id: S.user.id, numero_cuota: 1, total_cuotas: 2, monto_usd: cuotaInicialUsd, fecha_vencimiento: d1Str, estado: 'en_revision', referencia: refCard },
              { order_id: ordId, customer_id: S.user.id, numero_cuota: 2, total_cuotas: 2, monto_usd: cuotaDosUsd, fecha_vencimiento: d2Str, estado: 'pendiente' }
            ]).catch(()=>{});
          }

          checkoutDlg.close();
          await loadPublic();
          toast(`¡Pago procesado con éxito con tu Tarjeta Zeny! Descuento aplicado.`);
          portal();
        };
      }
      return;
    }

    // PASO 2: VENTANA CON LOS CAJONES ESTRUCTURADOS (ESTILO EXACTO IMAGEN 2)
    const fields = parseMethodFields(selectedMethod);
    let displayMethodName = selectedMethod?.nombre || 'Pago Móvil';
    if(/pago\s*m[oó]vil/i.test(displayMethodName)) displayMethodName = 'Pago Móvil';

    checkoutDlg.innerHTML = `
      <div class="checkout-card">
        <div class="checkout-top-bar">
          <button class="checkout-back-btn" id="coBackBtn" type="button" title="Volver a métodos">‹</button>
          <div class="checkout-progress-bar"><div class="checkout-progress-fill" style="width:100%"></div></div>
          <button class="checkout-close-btn" id="coCloseBtn" type="button">✕</button>
        </div>

        <div class="checkout-body">
          <!-- Monto compacto superior -->
          <div class="checkout-summary-box" style="margin-bottom:14px;padding:12px 14px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <span style="font-size:.72rem;color:#64748b;display:block">
                  ${payPlan === 'cuotas' ? 'Monto Cuota Inicial a transferir:' : 'Monto a transferir:'}
                </span>
                <span class="price-usd" style="font-size:1.35rem">$${restUsd.toFixed(2)} USD</span>
              </div>
              ${S.rate ? `<span class="price-bs" style="font-size:.92rem;font-weight:800;color:#0284c7">≈ Bs. ${restBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>` : ''}
            </div>
            ${payPlan === 'cuotas' ? `
              <div style="margin-top:6px;font-size:.74rem;color:var(--a);font-weight:700">
                ✨ Cuota 1 de 2. La cuota 2 ($${cuotaDosUsd.toFixed(2)}) vencerá el ${d2Str}.
              </div>
            ` : ''}
          </div>

          <!-- Cajones estructurados (Imagen 2) -->
          <div class="checkout-bank-details">
            <h3 class="checkout-bank-title">Transfiere a esta cuenta</h3>
            <div class="checkout-bank-alert">
              <span>ℹ️</span> Asegúrate de copiar los datos correctamente.
            </div>

            <div class="checkout-bank-list">
              ${fields.map((f, idx) => `
                <div class="checkout-bank-card">
                  <div class="checkout-bank-info">
                    <span class="checkout-bank-label">${esc(f.label)}</span>
                    <span class="checkout-bank-val" id="bankVal-${idx}">${esc(f.value)}</span>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Input de referencia -->
          <div class="checkout-input-group" style="margin-top:14px">
            <label for="coRefInput">Referencia o comprobante del pago</label>
            <input id="coRefInput" class="checkout-input" placeholder="Ej: 8 dígitos de referencia / comprobante" required>
          </div>

          <button id="coSubmitBtn" class="checkout-submit-btn" type="button">
            ${payPlan === 'cuotas' ? 'Enviar Pago de Cuota Inicial' : 'Enviar Pedido para Conciliación'}
          </button>
          <p class="mut" style="text-align:center;font-size:.72rem;margin:10px 0 0">
            🛡 Las credenciales se entregarán en tu portal tan pronto el administrador verifique tu pago.
          </p>
        </div>
      </div>
    `;

    $('#coBackBtn').onclick = () => {
      currentStep = 'method';
      renderCheckout();
    };

    $('#coCloseBtn').onclick = () => checkoutDlg.close();

    checkoutDlg.querySelectorAll('[data-copy]').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const textToCopy = btn.dataset.copy;
        try {
          if(navigator.clipboard && navigator.clipboard.writeText){
            await navigator.clipboard.writeText(textToCopy);
          } else {
            const ta = document.createElement('textarea');
            ta.value = textToCopy;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          const origHtml = btn.innerHTML;
          btn.classList.add('copied');
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = origHtml;
          }, 1800);
        } catch(err){
          toast('Copia manual: ' + textToCopy);
        }
      };
    });

    $('#coSubmitBtn').onclick = async () => {
      const btn = $('#coSubmitBtn');
      btn.disabled = true;
      const refVal = $('#coRefInput')?.value?.trim() || '';
      if(!refVal){
        btn.disabled = false;
        return toast('Por favor ingresa la referencia de tu pago.');
      }

      const orderRef = payPlan === 'cuotas' ? `[Cuotas 1/2] ${refVal}` : refVal;

      const {data: ordId, error} = await sb.rpc('create_order', {
        p_product: id,
        p_metodo: selectedMethodId,
        p_ref: orderRef,
        p_zeny: appliedZeny
      });

      if(error){
        btn.disabled = false;
        return toast(error.message.includes('Agotado') ? 'Este servicio se agotó. Elige otro.' : error.message);
      }

      if(payPlan === 'cuotas' && ordId){
        // Crear las cuotas correspondientes en la tabla installments
        await sb.from('installments').insert([
          { order_id: ordId, customer_id: S.user.id, numero_cuota: 1, total_cuotas: 2, monto_usd: cuotaInicialUsd, fecha_vencimiento: d1Str, estado: 'en_revision', metodo_id: selectedMethodId, referencia: refVal },
          { order_id: ordId, customer_id: S.user.id, numero_cuota: 2, total_cuotas: 2, monto_usd: cuotaDosUsd, fecha_vencimiento: d2Str, estado: 'pendiente' }
        ]).catch(()=>{});
      }

      checkoutDlg.close();
      await loadPublic();
      toast(payPlan === 'cuotas' ? `Pago de inicial enviado. Tu cuota 2 ($${cuotaDosUsd.toFixed(2)}) quedó registrada para el ${d2Str}.` : `Pedido enviado con éxito. Reservamos tu servicio por ${S.settings.reserva?.minutos||60} minutos.`);
      portal();
    };
  };

  renderCheckout();
  if(!checkoutDlg.open) checkoutDlg.showModal();
}

      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.37 7.31 24 12 24Z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.97 0 12s.46 3.83 1.26 5.42l4.02-3.15Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.63 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/></svg>
      Continuar con Google
    </button>
  `;

  const linksHtml = isReg
    ? `<span>¿Ya tienes cuenta? <a id="facetToggleMode">Inicia sesión</a></span>`
    : `<span>¿Nuevo cliente? <a id="facetToggleMode">Crear cuenta</a></span>`;

  facetDlg.innerHTML = renderFacetShell({title, subtitle, contentHtml, linksHtml});
  $('#facetCloseBtn').onclick = () => facetDlg.close();
  $('#facetToggleMode').onclick = () => loginDlg(isReg ? 'login' : 'register');

  $('#facetGoogle').onclick = () => sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + '/'}});

  $('#facetAction').onclick = async () => {
    const emailVal = ($('#facetId')?.value || '').trim();
    const pwVal = $('#facetPw')?.value || '';

    if(!emailVal) return toast('Ingresa tu correo electrónico');
    if(!emailVal.includes('@')) return toast('Debes ingresar un correo electrónico válido (ej: tu@gmail.com).');
    if(!pwVal || pwVal.length < 6) return toast('La contraseña debe tener al menos 6 caracteres');

    if(isReg){
      const nombreVal = ($('#facetNm')?.value || '').trim();
      const telVal = ($('#facetTel')?.value || '').trim();
      if(!nombreVal) return toast('Por favor ingresa tu nombre completo');

      const {data, error} = await sb.auth.signUp({
        email: emailVal,
        password: pwVal,
        options: {
          data: {
            nombre: nombreVal,
            telefono: telVal
          }
        }
      });

      if(error){
        if(error.message.includes('Phone signups are disabled')){
          return toast('El registro se realiza con correo electrónico o con Google.');
        }
        return toast(error.message);
      }

      // Si tenemos sesion inmediata y telefono, guardarlo en customers
      if(data?.user?.id && telVal){
        await sb.from('customers').update({telefono: telVal, nombre: nombreVal}).eq('id', data.user.id).catch(()=>{});
      }

      facetDlg.close();
      toast('Cuenta creada exitosamente. Revisa tu correo si requiere confirmación o inicia sesión.');
    } else {
      const {error} = await sb.auth.signInWithPassword({
        email: emailVal,
        password: pwVal
      });
      if(error) return toast(error.message);
      facetDlg.close();
      home();
    }
  };

  if(!facetDlg.open) facetDlg.showModal();
}

async function ensureAdminSession(){
  if(S.isAdmin) return true;
  try {
    let { data: { session } } = await sb.auth.getSession();
    if(!session?.user){
      const ref = await sb.auth.refreshSession();
      if(ref?.data?.session) session = ref.data.session;
    } else {
      const exp = session.expires_at || 0;
      const now = Math.floor(Date.now() / 1000);
      if(exp && (exp - now) < 180){
        const ref = await sb.auth.refreshSession();
        if(ref?.data?.session) session = ref.data.session;
      }
    }
    if(!session?.user) return false;
    await onSession(session);
    return !!S.isAdmin;
  } catch(e){
    console.warn('ensureAdminSession error:', e);
    return !!S.isAdmin;
  }
}

    }).eq('id', b.dataset.cred).catch(()=>{});
    if(tel){
      const waMsg = encodeURIComponent(`Hola ${nom}! Te saludamos de Emprendimiento Gregory Izquierdo. Tu servicio de ${prod} ha sido activado/renovado a CRÉDITO por 30 días. Monto pendiente: $${tot} USD. Fecha límite para el pago: ${fVence}. ¡Muchas gracias por tu preferencia!`);

    }
    toast(`Servicio entregado a CRÉDITO a ${nom}. Plazo: ${dias} días (hasta ${fVence}).`);
    admin(t);
  });
  app.querySelectorAll('[data-rej]').forEach(b=>b.onclick=async()=>{if(confirm('¿Rechazar pedido y liberar el perfil reservado?')){const {error:e}=await sb.rpc('reject_order',{p_order:b.dataset.rej});e?toast(e.message):admin(t);}});
  app.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>refundDlg(b.dataset.ref,b.dataset.tot,()=>admin(t)));
  app.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>transferDlg(b.dataset.tr,()=>admin(t)));
  app.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>genDlg(b.dataset.gen,()=>admin(t)));
  const form=async row=>{
    const fks={}; await Promise.all(cols.filter(c=>FK[c]).map(async c=>{const [tb,lb]=FK[c];const {data:d}=await sb.from(tb).select('id,'+lb).limit(500);fks[c]=d||[];}));
    const inp=c=>{const v=row?row[c]:''; const ro=(READONLY[t]||[]).includes(c)&&row;
      if(fks[c]) return `<select data-c="${c}"><option value="">—</option>${fks[c].map(o=>`<option value="${o.id}" ${row&&row[c]===o.id?'selected':''}>${esc(o[FK[c][1]])}</option>`).join('')}</select>`;
      if(ENUM[t+'.'+c]) return `<select data-c="${c}">${ENUM[t+'.'+c].map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
      if(BOOL.includes(c)) return `<select data-c="${c}"><option value="true" ${v!==false?'selected':''}>Sí</option><option value="false" ${v===false?'selected':''}>No</option></select>`;
      if(c==='imagen_url') return `<input data-c="${c}" value="${esc(v)}" placeholder="URL"><input type="file" accept="image/*" data-up style="margin-top:6px">`;
      if(typeof v==='string'&&v.startsWith('enc:')) return `<input data-c="${c}" type="password" placeholder="(sin cambios — escribe para reemplazar)" autocomplete="off">`;
      if(['clave','pin'].includes(c)) return `<input data-c="${c}" type="password" autocomplete="off">`;
      return `<input data-c="${c}" ${ro?'disabled':''} value="${esc(v&&typeof v==='object'?JSON.stringify(v):v)}">`;};
    $('#dlgBody').innerHTML=`<h3>${row?'Editar':'Agregar'} ${t}</h3><div style="max-height:62vh;overflow:auto">`+cols.map(c=>`<label class="mut">${c}</label>${inp(c)}`).join('')+'</div><button id="save" style="margin-top:10px;width:100%">Guardar</button>'; dlg.showModal();
    $('#save').onclick=async()=>{const o={};
      for(const i of dlg.querySelectorAll('[data-c]')){let v=i.value;if(v===''||i.disabled)continue;if(v==='true'||v==='false')v=v==='true';else if(/^[\[{]/.test(v))try{v=JSON.parse(v)}catch{};o[i.dataset.c]=v;}
      for(const f of dlg.querySelectorAll('[data-up]')){const file=f.files[0];if(file){const path=`${t}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;const u=await sb.storage.from('catalogo').upload(path,file);if(u.error)return toast(u.error.message);o.imagen_url=sb.storage.from('catalogo').getPublicUrl(path).data.publicUrl;}}
      const {error:e}=await (row?sb.from(t).update(o).eq(pk,row[pk]):sb.from(t).insert(o));e?toast(e.message):(dlg.close(),admin(t));};};
  if($('#add')) $('#add').onclick=()=>form(null);
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(data.find(r=>String(r[pk])===b.dataset.e)));
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar registro?')){const {error:e}=await sb.from(t).delete().eq(pk,b.dataset.x);e?toast(e.message):admin(t);}});
}

let _rt; const refresh=()=>{clearTimeout(_rt);_rt=setTimeout(async()=>{ if(!S.user) return;
  S.me=(await sb.from('customers').select('*').eq('id',S.user.id).maybeSingle()).data||S.me;
  if(S.view==='portal') portal(); else if(S.view==='admin'&&!dlg.open&&(TABLES[S.t]||S.t==='finanzas')) admin(S.t); badge(); },600);};
async function badge(){ if(!S.isAdmin) return; const c=(t,f)=>f(sb.from(t).select('id',{count:'exact',head:true}));
  const [a,b,i]=await Promise.all([c('orders',x=>x.eq('estado','pendiente')),c('zeny_ledger',x=>x.eq('estado','pendiente').eq('tipo','recarga')),c('incidents',x=>x.eq('estado','abierta'))]);
  const n=(a.count||0)+(b.count||0)+(i.count||0); $('#bAdmin').textContent=(n?`Admin (${n})`:'Admin')+(S.venc?` ⏰${S.venc}`:'');
  S.badges={orders:a.count||0,zeny_ledger:b.count||0,incidents:i.count||0};
  const bo=$('#sbBadge-orders'), bz=$('#sbBadge-zeny_ledger'), bi=$('#sbBadge-incidents');
  if(bo){ bo.textContent=a.count||0; bo.classList.toggle('hide',!a.count); }
  if(bz){ bz.textContent=b.count||0; bz.classList.toggle('hide',!b.count); }
  if(bi){ bi.textContent=i.count||0; bi.classList.toggle('hide',!i.count); }
}
// ---------- ALERTAS SONORAS (solo administrador, mientras la app o pestaña esté abierta) ----------
let _ac; const sndOn=()=>localStorage.getItem('snd')!=='0';
const unlock=()=>{ try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); }catch{} updSnd(); };
addEventListener('pointerdown',unlock,{passive:true});
function updSnd(){ const b=$('#bSnd'); if(b) b.textContent=!sndOn()?'🔕 Sin sonido':(_ac&&_ac.state==='running'?'🔔 Sonido':'🔔 Toca para activar'); }
$('#bSnd').onclick=async()=>{ localStorage.setItem('snd',sndOn()?'0':'1'); unlock(); updSnd();
  if(sndOn()){ beep('order'); if('Notification' in window&&Notification.permission==='default') Notification.requestPermission(); } };
function beep(kind){ if(!sndOn()||!_ac||_ac.state!=='running') return;
  const seq={order:[[880,.15],[1175,.3]],recarga:[[660,.15],[660,.15],[990,.3]],incidencia:[[440,.3],[330,.3],[440,.3]],venc:[[784,.2],[988,.2],[1175,.2],[988,.2]]}[kind]||[[880,.2]]; let t=_ac.currentTime;
  for(const [f,d] of seq){ const o=_ac.createOscillator(),g=_ac.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02); t+=d+.06; } }
function banner(msg){ let b=$('#alertbox'); if(!b){ b=document.createElement('div'); b.id='alertbox'; b.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:20;display:grid;gap:6px;pointer-events:none;max-width:520px;margin:auto'; document.body.appendChild(b); }
  const d=document.createElement('div'); d.className='card'; d.style.cssText='pointer-events:auto;border-color:var(--a);display:flex;justify-content:space-between;align-items:center;gap:8px'; d.innerHTML=`<span>🔔 ${esc(msg)}</span>`;
  const x=document.createElement('button'); x.className='g'; x.textContent='✕'; x.onclick=()=>d.remove(); d.appendChild(x); b.appendChild(d); setTimeout(()=>d.remove(),20000); }
function notify(kind,msg){ beep(kind); banner(msg); try{ if(navigator.vibrate) navigator.vibrate(kind==='incidencia'?[200,100,200,100,200]:[250]);
  if('Notification' in window&&Notification.permission==='granted'&&document.hidden) new Notification('Gregory Izquierdo',{body:msg,icon:'/icon-192.png',tag:kind}); }catch{}
  document.title='🔔 '+msg; setTimeout(()=>document.title='Emprendimiento Gregory Izquierdo',8000); badge(); }
const ALERTS={orders:{ok:r=>r.estado==='pendiente',kind:'order',msg:'Nuevo pedido pendiente de conciliación'},
  zeny_ledger:{ok:r=>r.tipo==='recarga'&&r.estado==='pendiente',kind:'recarga',msg:'Nueva recarga Zeny por aprobar'},
  incidents:{ok:()=>true,kind:'incidencia',msg:'Nueva incidencia reportada por un cliente'}};
Object.entries(ALERTS).reduce((ch,[t,a])=>ch.on('postgres_changes',{event:'INSERT',schema:'public',table:t},p=>{ if(S.isAdmin&&a.ok(p.new)) notify(a.kind,a.msg); }),sb.channel('alerts')).subscribe();
// Vencimientos del dia: servicios de clientes y cuentas madre. Suena una vez por cada nuevo vencimiento del dia, y se revisa cada hora.
async function checkVenc(){ if(!S.isAdmin) return; const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const [o,m]=await Promise.all([sb.from('orders').select('id',{count:'exact',head:true}).eq('estado','entregado').eq('vence',d), sb.from('mother_accounts').select('id',{count:'exact',head:true}).eq('activa',true).eq('vence',d)]);
  const a=o.count||0, b=m.count||0, n=a+b; S.venc=n; const k='venc-'+d, prev=+(localStorage.getItem(k)||0);
  if(n>prev){ localStorage.setItem(k,n); notify('venc',`Vencen hoy: ${a} servicio(s) de clientes y ${b} cuenta(s) madre`); } else badge(); }
setInterval(checkVenc,3600000);
['orders','zeny_ledger','customers','incidents','profiles_inventory','refunds','expenses','purchases','transfers'].reduce((ch,t)=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},refresh),sb.channel('live')).subscribe();
