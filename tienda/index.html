          const opt = document.createElement('option');
          opt.value = catVal;
          opt.textContent = catVal;
          opt.selected = true;
          sel.appendChild(opt);
        }
        const curCats = S.settings?.expenses_categories || [];
        if(!curCats.includes(catVal)){
          curCats.push(catVal);
          try { await sb.from('settings').upsert({ key: 'expenses_categories', value: curCats }); } catch(e){}
          if(S.settings) S.settings.expenses_categories = curCats;
        }
        toast(`Concepto "${catVal}" agregado al menú desplegable.`);
      };
    }

    // Conversión bimoneda en tiempo real para Gastos (Bs a USD y viceversa)
    if(t === 'expenses'){
      const inpBs = dlg.querySelector('[data-c="monto_bs"]');
      const inpUsd = dlg.querySelector('[data-c="monto_usd"]');
      const curRate = Number(S.rate || 50.00);
      if(inpBs && inpUsd){
        inpBs.oninput = () => {
          const valBs = parseFloat(inpBs.value);
          if(!isNaN(valBs) && curRate > 0){
            inpUsd.value = (valBs / curRate).toFixed(2);
          }
        };
        inpUsd.oninput = () => {
          const valUsd = parseFloat(inpUsd.value);
          if(!isNaN(valUsd) && curRate > 0){
            inpBs.value = (valUsd * curRate).toFixed(2);
          }
        };
      }
    }

    // Conversión bimoneda, cálculo de crédito y fecha límite para Compras
    if(t === 'purchases'){
      const inpBs = dlg.querySelector('[data-c="monto_bs"]');
      const inpUsd = dlg.querySelector('[data-c="monto_usd"]');
      const inpUsdt = dlg.querySelector('[data-c="monto_usdt"]');
      const selCred = dlg.querySelector('[data-c="es_credito"]');
      const inpDias = dlg.querySelector('[data-c="dias_credito"]');
      const inpFecha = dlg.querySelector('[data-c="fecha"]');
      const inpFechaLim = dlg.querySelector('[data-c="fecha_limite_pago"]');
      const selEst = dlg.querySelector('[data-c="estado_pago"]');
      const curRate = Number(S.rate || 50.00);

      const updateCreditFields = () => {
        const isCred = selCred ? (selCred.value === 'true' || selCred.value === true) : false;
        if(isCred){
          if(selEst && !row) selEst.value = 'pendiente';
          const dias = parseInt(inpDias?.value) || 0;
          if(dias > 0 && inpFechaLim){
            const baseD = inpFecha?.value ? new Date(inpFecha.value+'T00:00:00') : new Date();
            baseD.setDate(baseD.getDate() + dias);
            inpFechaLim.value = baseD.toISOString().slice(0, 10);
          }
        } else {
          if(selEst && !row) selEst.value = 'pagado';
        }
      };

      if(selCred) selCred.onchange = updateCreditFields;
      if(inpDias) inpDias.oninput = updateCreditFields;
      if(inpFecha) inpFecha.onchange = updateCreditFields;

      if(inpBs && inpUsd && inpUsdt){
        inpBs.oninput = () => {
          const valBs = parseFloat(inpBs.value);
          if(!isNaN(valBs) && curRate > 0){
            const usd = (valBs / curRate).toFixed(2);
            inpUsd.value = usd;
            inpUsdt.value = usd;
          }
        };
        inpUsdt.oninput = () => {
          const valUsdt = parseFloat(inpUsdt.value);
          if(!isNaN(valUsdt)){
            inpUsd.value = valUsdt.toFixed(2);
            if(curRate > 0) inpBs.value = (valUsdt * curRate).toFixed(2);
          }
        };
        inpUsd.oninput = () => {
          const valUsd = parseFloat(inpUsd.value);
          if(!isNaN(valUsd)){
            inpUsdt.value = valUsd.toFixed(2);
            if(curRate > 0) inpBs.value = (valUsd * curRate).toFixed(2);
          }
        };
      }
    }

    const btnCalc = $('#btnCalcBinanceDiff');
    if(btnCalc){
      btnCalc.onclick = () => {
        const pUsd = parseFloat(dlg.querySelector('[data-c="precio_usd"]')?.value || 0);
        const tBcv = parseFloat($('#calcRateBcv')?.value || 0) || (S.rate || 0);
        const tAlCambio = parseFloat($('#calcRateAlCambio')?.value || 1008.90);
        if(pUsd <= 0) return toast('Ingresa primero el Precio Base USD.');
        if(tAlCambio <= 0) return toast('Indica una tasa de Al Cambio válida (ej. 1008.90).');
        const totalBs = pUsd * (tBcv > 0 ? tBcv : 1);
        const usdtVal = tBcv > 0 ? Math.round((totalBs / tAlCambio) * 100) / 100 : pUsd;
        const inpBin = dlg.querySelector('[data-c="precio_binance_usd"]');
        if(inpBin){
          inpBin.value = usdtVal.toFixed(2);
          const preview = $('#calcDiffPreview');
          if(preview) preview.innerHTML = `✓ Calculado: <b>$${usdtVal.toFixed(2)} USDT</b> (${pUsd} USD × ${tBcv} Bs ÷ ${tAlCambio} Bs/USDT)`;
          toast(`Precio Binance calculado: $${usdtVal.toFixed(2)} USDT`);
        }
      };
    }
    $('#save').onclick=async()=>{
      const btnSave = $('#save');
      if(btnSave) { btnSave.disabled = true; btnSave.textContent = '⏳ Guardando...'; }
      const o={};
      for(const i of dlg.querySelectorAll('[data-c]')){let v=i.value;if(v===''||i.disabled)continue;if(v==='true'||v==='false')v=v==='true';else if(/^[\[{]/.test(v))try{v=JSON.parse(v)}catch{};o[i.dataset.c]=v;}
      let {error:e}=await (row?sb.from(t).update(o).eq(pk,row[pk]):sb.from(t).insert(o));
      if(e && e.message && e.message.includes('permite_cuotas')){
        const oFallback = {...o};
        delete oFallback.permite_cuotas;
        const retry = await (row?sb.from(t).update(oFallback).eq(pk,row[pk]):sb.from(t).insert(oFallback));
        if(!retry.error){
          dlg.close();
          toast('Producto guardado.');
          return admin(t);
        }
        e = retry.error;
      }
      if(!e && t === 'purchases' && o.mother_id && o.monto_usd != null){
        const costUsd = parseFloat(o.monto_usd) || 0;
        try { await sb.from('mother_accounts').update({ costo_usd: costUsd }).eq('id', o.mother_id); } catch(err){}
      }
      if(e){
        if(btnSave) { btnSave.disabled = false; btnSave.textContent = 'Guardar'; }
        alert('⚠️ Error al guardar: ' + e.message);
      } else {
        dlg.close();
        toast('Guardado con éxito.');
        admin(t);
      }
    };};
  if($('#add')) $('#add').onclick=()=>{
    if(curTab==='refunds'){
      return refundDlg(null, 0, ()=>admin(curTab));
    }
    form(null);
  };
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(data.find(r=>String(r[pk])===b.dataset.e)));
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar registro?')){const {error:e}=await sb.from(t).delete().eq(pk,b.dataset.x);e?toast(e.message):admin(t);}});
}
// ---------- TIEMPO REAL, BADGE DE PENDIENTES E INSTALACION ----------
let _rt; const refresh=()=>{clearTimeout(_rt);_rt=setTimeout(async()=>{ if(!S.user) return;
  S.me=(await sb.from('customers').select('*').eq('id',S.user.id).maybeSingle()).data||S.me;
  if(S.view==='portal') portal(); else if(S.view==='admin'&&!dlg.open&&(TABLES[S.t]||S.t==='finanzas')) admin(S.t); badge(); },600);};
async function badge(){ if(!S.isAdmin) return; const c=(t,f)=>f(sb.from(t).select('id',{count:'exact',head:true}));
  const [a,b,i]=await Promise.all([c('orders',x=>x.eq('estado','pendiente')),c('zeny_ledger',x=>x.eq('estado','pendiente').eq('tipo','recarga')),c('incidents',x=>x.eq('estado','abierta'))]);
  const n=(a.count||0)+(b.count||0)+(i.count||0); $('#bAdmin').textContent=(n?`Admin (${n})`:'Admin')+(S.venc?` ⏰${S.venc}`:'');
  S.badges={orders:a.count||0,zeny_ledger:b.count||0,incidents:i.count||0};
  const bo=$('#sbBadge-orders'), bz=$('#sbBadge-zeny_ledger'), bi=$('#sbBadge-incidents');
  if(bo){ bo.textContent=a.count||0; bo.classList.toggle('hide',!a.count); }
  if(bz){ bz.textContent=b.count||0; bz.classList.toggle('hide',!b.count); }
  if(bi){ bi.textContent=i.count||0; bi.classList.toggle('hide',!i.count); }
}
// ---------- ALERTAS SONORAS (solo administrador, mientras la app o pestaña esté abierta) ----------
let _ac; const sndOn=()=>localStorage.getItem('snd')!=='0';
const unlock=()=>{ try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); }catch{} updSnd(); };
addEventListener('pointerdown',unlock,{passive:true});
function updSnd(){ const b=$('#bSnd'); if(b) b.textContent=!sndOn()?'🔕 Sin sonido':(_ac&&_ac.state==='running'?'🔔 Sonido':'🔔 Toca para activar'); }
$('#bSnd').onclick=async()=>{ localStorage.setItem('snd',sndOn()?'0':'1'); unlock(); updSnd();
  if(sndOn()){ beep('order'); if('Notification' in window&&Notification.permission==='default') Notification.requestPermission(); } };
function beep(kind){ if(!sndOn()||!_ac||_ac.state!=='running') return;
  const seq={order:[[880,.15],[1175,.3]],recarga:[[660,.15],[660,.15],[990,.3]],incidencia:[[440,.3],[330,.3],[440,.3]],venc:[[784,.2],[988,.2],[1175,.2],[988,.2]]}[kind]||[[880,.2]]; let t=_ac.currentTime;
  for(const [f,d] of seq){ const o=_ac.createOscillator(),g=_ac.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02); t+=d+.06; } }
function banner(msg){ let b=$('#alertbox'); if(!b){ b=document.createElement('div'); b.id='alertbox'; b.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:20;display:grid;gap:6px;pointer-events:none;max-width:520px;margin:auto'; document.body.appendChild(b); }
  const d=document.createElement('div'); d.className='card'; d.style.cssText='pointer-events:auto;border-color:var(--a);display:flex;justify-content:space-between;align-items:center;gap:8px'; d.innerHTML=`<span>🔔 ${esc(msg)}</span>`;
  const x=document.createElement('button'); x.className='g'; x.textContent='✕'; x.onclick=()=>d.remove(); d.appendChild(x); b.appendChild(d); setTimeout(()=>d.remove(),20000); }
function notify(kind,msg){ beep(kind); banner(msg); try{ if(navigator.vibrate) navigator.vibrate(kind==='incidencia'?[200,100,200,100,200]:[250]);
  if('Notification' in window&&Notification.permission==='granted'&&document.hidden) new Notification('Gregory Izquierdo',{body:msg,icon:'/icon-192.png',tag:kind}); }catch{}
  document.title='🔔 '+msg; setTimeout(()=>document.title='Emprendimiento Gregory Izquierdo',8000); badge(); }
const ALERTS={orders:{ok:r=>r.estado==='pendiente',kind:'order',msg:'Nuevo pedido pendiente de conciliación'},
  zeny_ledger:{ok:r=>r.tipo==='recarga'&&r.estado==='pendiente',kind:'recarga',msg:'Nueva recarga Zeny por aprobar'},
  incidents:{ok:()=>true,kind:'incidencia',msg:'Nueva incidencia reportada por un cliente'}};
Object.entries(ALERTS).reduce((ch,[t,a])=>ch.on('postgres_changes',{event:'INSERT',schema:'public',table:t},p=>{ if(S.isAdmin&&a.ok(p.new)) notify(a.kind,a.msg); }),sb.channel('alerts')).subscribe();
// Vencimientos del dia: servicios de clientes y cuentas madre para Admin, y vencimientos de sus propios clientes para Revendedores.
async function checkVenc(){
  const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(S.isAdmin){
    const [o,m]=await Promise.all([sb.from('orders').select('id',{count:'exact',head:true}).eq('estado','entregado').eq('vence',d), sb.from('mother_accounts').select('id',{count:'exact',head:true}).eq('activa',true).eq('vence',d)]);
    const a=o.count||0, b=m.count||0, n=a+b; S.venc=n; const k='venc-'+d, prev=+(localStorage.getItem(k)||0);
    if(n>prev){ localStorage.setItem(k,n); notify('venc',`Vencen hoy: ${a} servicio(s) de clientes y ${b} cuenta(s) madre`); } else badge();
  } else if(S.me?.es_revendedor && S.user){
    try {
      const { data: list } = await sb.rpc('my_reseller_clients');
      if(list && Array.isArray(list)){
        const expToday = list.filter(r => r.vence === d && r.estado === 'vendido');
        const count = expToday.length;
        const k = 'reseller-venc-' + d + '-' + S.user.id;
        const prev = +(localStorage.getItem(k) || 0);
        if(count > 0 && count > prev){
          localStorage.setItem(k, count);
          notify('venc', `⏰ Vencimientos de hoy: Tienes ${count} cliente(s) con suscripción por vencer hoy (${d}). Revisa tu portal para renovar o reportar.`);
        }
      }
    } catch(e){}
  }
}
setInterval(checkVenc,3600000);
['orders','zeny_ledger','customers','incidents','profiles_inventory','refunds','expenses','purchases','transfers'].reduce((ch,t)=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},refresh),sb.channel('live')).subscribe();
let _dip; addEventListener('beforeinstallprompt',e=>{e.preventDefault();_dip=e;});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone) $('#bInstall').classList.add('hide');
$('#bInstall').onclick=()=>{ const apk=S.settings.app?.apk_url||'', ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $('#dlgBody').innerHTML='<h3>Instalar la app</h3>'+(_dip?'<button id="ip" style="width:100%">Instalar en este dispositivo</button>':'')
   +(ios?'<p>En iPhone/iPad (Safari): pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.</p>':(!_dip?'<p>En Android (Chrome): menú ⋮ → <b>Instalar aplicación</b>.</p>':''))
   +(/^https:\/\//.test(apk)?`<p><a href="${esc(apk)}" rel="noopener noreferrer">Descargar APK (Android)</a></p><p class="mut">Android pedirá permitir la instalación de este archivo.</p>`:'')
   +'<p class="mut">La app muestra siempre los datos en tiempo real de la tienda.</p>'; dlg.showModal();
  if($('#ip')) $('#ip').onclick=async()=>{_dip.prompt();await _dip.userChoice;dlg.close();}; };
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
